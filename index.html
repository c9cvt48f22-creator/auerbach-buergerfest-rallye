<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7d1f2d">
<title>Das Geheimnis des Bürgerfests – Testversion 0.3</title>
<style>
:root{
  --cream:#fff9ef; --cream2:#f7ead4; --navy:#10233f; --wine:#8f2032;
  --gold:#d8a22e; --green:#2e8b57; --red:#c62828; --blue:#2f63c7;
  --ink:#1f2937; --card:#fffdf8; --line:#dfd2bd;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; color:var(--ink);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:
    radial-gradient(circle at 15% 8%, rgba(216,162,46,.18), transparent 22rem),
    linear-gradient(180deg,var(--cream),#f4e6d0);
}
header{
  background:linear-gradient(135deg,var(--navy),#17345e);
  color:white; padding:18px 20px; position:sticky; top:0; z-index:20;
  box-shadow:0 4px 18px rgba(0,0,0,.15)
}
.header-inner{max-width:820px;margin:auto;display:flex;align-items:center;gap:14px}
.logo{
  width:50px;height:58px;border:2px solid var(--gold);border-radius:16px 16px 22px 22px;
  display:grid;place-items:center;font-size:28px;background:#7d1f2d
}
header strong{font-size:1.15rem}
header small{display:block;color:#e9ddc8}
main{max-width:820px;margin:auto;padding:18px}
.hero,.card{
  background:rgba(255,253,248,.97); border:1px solid var(--line);
  border-radius:22px; padding:24px; margin:16px 0;
  box-shadow:0 16px 35px rgba(74,52,31,.10)
}
.hero{
  overflow:hidden; position:relative;
  background:
    linear-gradient(135deg,rgba(255,253,248,.98),rgba(255,247,231,.94)),
    repeating-linear-gradient(45deg,transparent 0 16px,rgba(216,162,46,.06) 16px 18px);
}
.hero:after{
  content:""; position:absolute; right:-70px; bottom:-90px; width:250px; height:250px;
  border:28px solid rgba(143,32,50,.06); border-radius:50%
}
.eyebrow{color:var(--wine);font-weight:900;letter-spacing:.08em;text-transform:uppercase}
h1{font-family:Georgia,serif;color:var(--navy);font-size:clamp(2.3rem,8vw,4rem);line-height:1.02;margin:.25em 0}
h2{color:var(--navy);font-family:Georgia,serif}
p,li,label,input,textarea,button,select{font-size:1.04rem}
.lead{font-size:1.2rem;line-height:1.55}
.grid{display:grid;gap:14px}
.two{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.feature{
  border:1px solid var(--line);border-radius:16px;padding:16px;background:#fffaf1
}
.feature b{display:block;color:var(--navy);margin-bottom:5px}
input,textarea,select{
  width:100%;padding:14px;margin-top:7px;border-radius:12px;border:1px solid #b9ab96;
  background:white;color:var(--ink)
}
textarea{min-height:98px;resize:vertical}
button,.button{
  display:inline-block;width:100%;padding:15px 18px;margin-top:11px;border:0;border-radius:14px;
  background:linear-gradient(135deg,var(--wine),#b73549);color:white;font-weight:900;
  text-align:center;text-decoration:none;cursor:pointer;box-shadow:0 8px 18px rgba(143,32,50,.22)
}
button.secondary,.button.secondary{background:var(--navy);box-shadow:none}
button.ghost,.button.ghost{background:#efe3cf;color:var(--navy);box-shadow:none}
button.danger{background:var(--red)}
.status{padding:16px;border-radius:14px;text-align:center;font-weight:800;margin:13px 0;color:white}
.info{background:var(--blue)} .good{background:var(--green)} .bad{background:var(--red)}
.timer{font-size:2rem;font-variant-numeric:tabular-nums;font-weight:1000;color:var(--navy)}
.score{font-size:1.6rem;font-weight:1000;color:var(--wine)}
.progress{height:12px;background:#eadcc8;border-radius:999px;overflow:hidden}
.progress>div{height:100%;background:linear-gradient(90deg,var(--gold),#f0c25c)}
.muted{color:#667085}
.pill{display:inline-block;padding:7px 10px;border-radius:999px;background:#eee1cd;margin:4px}
.flash{
  position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:30px;color:white;font-size:clamp(2rem,10vw,5rem);font-weight:1000
}
.flash.good{background:var(--green)} .flash.bad{background:var(--red)}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
footer{max-width:820px;margin:auto;padding:20px;text-align:center;color:#6b6257}
.small{font-size:.9rem}
#reader{width:100%;overflow:hidden;border-radius:16px;background:#fff;margin-top:12px}
.scanner-box{border:2px dashed var(--gold);border-radius:18px;padding:16px;background:#fffaf1}
.scanner-note{font-size:.92rem;color:#667085;line-height:1.45}
</style>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="logo">🦬</div>
    <div><strong>Das Geheimnis des Bürgerfests</strong><small>Auerbach i. d. OPf. · Testversion 0.3</small></div>
  </div>
</header>
<main id="app"></main>
<footer>Testversion 0.3 · Ergebnisse werden vorerst nur auf dem jeweiligen Gerät gespeichert.</footer>

<script>
const BASE_URL="https://c9cvt48f22-creator.github.io/auerbach-buergerfest-rallye/";
const STATE_KEY="auerbach_state_v03";
const RESULTS_KEY="auerbach_results_v03";

const stations={
  1:{
    title:"Das Zeichen der Stadt",
    locationHint:"Sucht im Test einen Ort, an dem ein Auerbacher Wappen oder Stadtzeichen zu sehen sein könnte.",
    story:"Die erste Nachricht deutet an: Ein gemeinsames Zeichen verbindet Menschen, die zu einer Stadt gehören.",
    task:`Ein Wort wurde durcheinandergebracht:<br><br>
    <strong style="font-size:1.45rem">R · U · O · C · H · A · E · S</strong><br><br>
    Ordnet die Buchstaben zu einem Tier, das eng mit Auerbach verbunden ist.`,
    answers:["auerochse"],
    hint1:"Das gesuchte Tier beginnt mit „Auer…“.",
    hint2:"Die Lösung lautet: AUEROCHSE.",
    maxPoints:100
  },
  2:{
    title:"Die Botschaft der Bergleute",
    locationHint:"Sucht im Test einen Ort, der an Bergbau, Erz oder die Bergleute erinnert.",
    story:"Die zweite Nachricht zeigt: Unter Tage waren Vertrauen, gegenseitige Hilfe und Zusammenarbeit lebenswichtig.",
    task:`Entschlüsselt den Morsecode. Ein Schrägstrich trennt die beiden Wörter:<br><br>
    <strong style="font-size:1.35rem">--. .-.. ..- . -.-. -.- / .- ..- ..-.</strong><br><br>
    Gebt den bekannten Bergmannsgruß ein.`,
    answers:["glück auf","glueck auf"],
    hint1:"Das zweite Wort lautet „auf“.",
    hint2:"Die Lösung lautet: GLÜCK AUF.",
    maxPoints:130
  },
  3:{
    title:"Wer macht das Fest möglich?",
    locationHint:"Sucht im Test einen ruhigeren Ort, an dem ihr gemeinsam überlegen könnt.",
    story:"Die dritte Nachricht macht klar: Viele verschiedene Gruppen tragen etwas bei. Keine davon könnte das Bürgerfest allein schaffen.",
    task:`Löst die vier Begriffe und nehmt jeweils den ersten Buchstaben:<br><br>
    1. Menschen, die freiwillig mithelfen.<br>
    2. Gruppen, die Stände und Aktionen anbieten.<br>
    3. Menschen, die das Bürgerfest besuchen.<br>
    4. Menschen, die planen und koordinieren.<br><br>
    Gebt die vier Anfangsbuchstaben ohne Leerzeichen ein.`,
    answers:["hvbo"],
    hint1:"Die Begriffe beginnen mit H, V, B und O.",
    hint2:"Die Lösung lautet: HVBO.",
    maxPoints:160
  }
};
const routes=[[1,2,3],[2,3,1],[3,1,2]];

function esc(v){return String(v||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function load(){try{return JSON.parse(localStorage.getItem(STATE_KEY))}catch(e){return null}}
function save(s){localStorage.setItem(STATE_KEY,JSON.stringify(s))}
function results(){try{return JSON.parse(localStorage.getItem(RESULTS_KEY))||[]}catch(e){return[]}}
function saveResults(r){localStorage.setItem(RESULTS_KEY,JSON.stringify(r))}
function norm(v){return(v||"").toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ß/g,"ss").replace(/\s+/g," ")}
function fmt(ms){let s=Math.max(0,Math.floor(ms/1000));return [Math.floor(s/3600),Math.floor((s%3600)/60),s%60].map(x=>String(x).padStart(2,"0")).join(":")}
function current(s){return s.route[s.routeIndex]}
function stationParam(){return Number(new URLSearchParams(location.search).get("station"))||null}
function clearQuery(){history.replaceState({},"",location.pathname)}
function flash(type,text,cb){
  const d=document.createElement("div");d.className="flash "+type;d.innerHTML=text;document.body.appendChild(d);
  if(navigator.vibrate)navigator.vibrate(type==="bad"?[160,80,160]:120);
  setTimeout(()=>{d.remove();cb&&cb()},1400)
}

function start(){
  const q=new URLSearchParams(location.search);
  if(q.get("admin")==="1"){renderAdmin();return}
  const s=load();
  if(!s){renderLanding();return}
  if(s.finished){renderFinish(s);return}
  const p=stationParam();
  if(p){handleScan(s,p);return}
  renderMission(s)
}

function renderLanding(){
  app.innerHTML=`
  <section class="hero">
    <div class="eyebrow">Test-Rallye · Auerbach i. d. OPf.</div>
    <h1>Das Geheimnis des Bürgerfests</h1>
    <p class="lead">Kurz vor dem Bürgerfest ist eine rätselhafte Botschaft aufgetaucht. Niemand weiß, wer sie geschrieben hat – oder was sie wirklich bedeutet.</p>
    <p class="lead"><strong>Nur Teams, die genau beobachten, kombinieren und zusammenarbeiten, können das Geheimnis lüften.</strong></p>
    <button onclick="document.getElementById('signup').scrollIntoView({behavior:'smooth'})">Mission beginnen</button>
  </section>
  <section class="card">
    <div class="grid two">
      <div class="feature"><b>👥 Als Team spielen</b>Bis zu sechs Personen lösen gemeinsam die Aufgaben.</div>
      <div class="feature"><b>🧩 Rätsel entschlüsseln</b>Antworten, Codes und Hinweise bringen euch weiter.</div>
      <div class="feature"><b>🗺️ Drei Routen</b>Teams starten in unterschiedlicher Reihenfolge.</div>
      <div class="feature"><b>🏆 Punkte sammeln</b>Die Zeit entscheidet nur bei Punktgleichstand.</div>
    </div>
  </section>
  <section class="card" id="signup">
    <h2>Team anmelden</h2>
    <label>Teamname<input id="team" maxlength="40" placeholder="z. B. Die Codeknacker"></label>
    <label>Vornamen aller Teammitglieder<textarea id="members" placeholder="z. B. Mia, Leon, Samir, Emma"></textarea></label>
    <label><input id="adult" type="checkbox" style="width:auto"> Eine erwachsene Begleitperson weiß von unserer Teilnahme.</label>
    <label>Fotoveröffentlichung
      <select id="consent">
        <option value="no">Keine Veröffentlichung</option>
        <option value="yes">Veröffentlichung wurde erlaubt</option>
      </select>
    </label>
    <button onclick="begin()">Test-Rallye starten</button>
    <div class="status info">Diese Testversion speichert Ergebnisse nur auf diesem Gerät. Die zentrale Auswertung folgt als nächster Schritt.</div>
  </section>`
}

function begin(){
  const team=document.getElementById("team").value.trim();
  const members=document.getElementById("members").value.trim();
  if(!team||!members){alert("Bitte Teamname und Vornamen eintragen.");return}
  if(!document.getElementById("adult").checked){alert("Bitte bestätigt, dass eine erwachsene Begleitperson Bescheid weiß.");return}
  const s={
    id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())),
    team,members,consent:document.getElementById("consent").value,
    route:routes[Math.floor(Math.random()*routes.length)],routeIndex:0,
    startedAt:Date.now(),score:0,attempts:{},hints:{},solved:[],finished:false
  };
  save(s);renderMission(s)
}

function renderMission(s){
  const st=stations[current(s)],pct=Math.round((s.solved.length/3)*100);
  app.innerHTML=`
  <section class="card">
    <div class="eyebrow">Team ${esc(s.team)}</div>
    <div class="grid two">
      <div><span class="muted">Zeit</span><div class="timer" id="timer">${fmt(Date.now()-s.startedAt)}</div></div>
      <div><span class="muted">Punkte</span><div class="score">${s.score}</div></div>
    </div>
    <div class="progress"><div style="width:${pct}%"></div></div>
    <p class="muted">${s.solved.length} von 3 Teststationen gelöst</p>
  </section>
  <section class="card">
    <div class="eyebrow">Nächste Spur</div>
    <h2>${st.title}</h2>
    <p>${st.locationHint}</p>
    <p class="muted">Sucht den QR-Code an der Station und scannt ihn direkt hier in der Website. Die Seite bleibt dabei geöffnet.</p>
    <button onclick="openScanner()">QR-Code direkt scannen</button>
    <a class="button ghost" href="${BASE_URL}?station=${current(s)}">Nur zum Test: richtigen Code öffnen</a>
    <a class="button ghost" href="${BASE_URL}?station=${current(s)===1?2:1}">Nur zum Test: falschen Code öffnen</a>
  </section>
  <section class="card">
    <button class="secondary" onclick="location.href='${BASE_URL}?admin=1'">Auswertung auf diesem Gerät</button>
    <button class="danger" onclick="if(confirm('Test wirklich zurücksetzen?')){localStorage.removeItem(STATE_KEY);location.href='${BASE_URL}'}">Test zurücksetzen</button>
  </section>`;
  setInterval(()=>{const e=document.getElementById("timer");if(e)e.textContent=fmt(Date.now()-s.startedAt)},1000)
}


let qrScanner=null;
let scannerBusy=false;

function openScanner(){
  const s=load();
  app.innerHTML=`
  <section class="card">
    <div class="eyebrow">QR-Scanner</div>
    <h2>Nächste Station scannen</h2>
    <div class="scanner-box">
      <div id="reader"></div>
      <p class="scanner-note">
        Beim ersten Mal fragt Safari nach dem Kamerazugriff. Tippt auf „Erlauben“.
        Haltet den QR-Code ruhig und vollständig in den Rahmen.
      </p>
    </div>
    <button class="secondary" onclick="closeScanner()">Scanner schließen</button>
  </section>`;

  if(typeof Html5Qrcode==="undefined"){
    alert("Der Scanner konnte nicht geladen werden. Prüft die Internetverbindung.");
    renderMission(s);
    return;
  }

  qrScanner=new Html5Qrcode("reader");
  scannerBusy=false;

  qrScanner.start(
    {facingMode:"environment"},
    {fps:10, qrbox:{width:240,height:240}, aspectRatio:1.0},
    decodedText=>{
      if(scannerBusy)return;
      scannerBusy=true;
      const stationNumber=extractStationNumber(decodedText);
      stopScanner().then(()=>{
        if(!stationNumber){
          flash("bad","UNGÜLTIGER QR-CODE<br><span style='font-size:.34em'>Dieser Code gehört nicht zur Rallye.</span>",()=>renderMission(load()));
          return;
        }
        handleScan(load(),stationNumber);
      });
    },
    ()=>{}
  ).catch(err=>{
    console.error(err);
    alert("Die Kamera konnte nicht geöffnet werden. Bitte erlaubt Safari den Kamerazugriff oder nutzt unten die Testknöpfe.");
    renderMission(s);
  });
}

function extractStationNumber(text){
  try{
    const url=new URL(text,location.href);
    const value=Number(url.searchParams.get("station"));
    return Number.isInteger(value)&&value>0 ? value : null;
  }catch(e){
    const match=String(text).match(/station\s*=\s*(\d+)/i);
    return match ? Number(match[1]) : null;
  }
}

async function stopScanner(){
  if(!qrScanner)return;
  try{
    if(qrScanner.isScanning)await qrScanner.stop();
    await qrScanner.clear();
  }catch(e){console.warn(e)}
  qrScanner=null;
}

async function closeScanner(){
  await stopScanner();
  renderMission(load());
}

function handleScan(s,n){
  const expected=current(s);clearQuery();
  if(n!==expected){flash("bad","FALSCHER QR-CODE<br><span style='font-size:.34em'>Diese Station gehört noch nicht zu eurer Route.</span>",()=>renderMission(s));return}
  flash("good","STATION GEFUNDEN",()=>renderPuzzle(s,n))
}

function renderPuzzle(s,n){
  const st=stations[n];
  app.innerHTML=`
  <section class="card">
    <div class="eyebrow">Station ${s.routeIndex+1} von 3</div>
    <h1 style="font-size:2.5rem">${st.title}</h1>
    <p class="lead">${st.task}</p>
    <label>Eure Lösung<input id="answer" autocomplete="off" placeholder="Antwort eingeben"></label>
    <button onclick="check(${n})">Antwort prüfen</button>
    <button class="ghost" onclick="hint(${n},1)">Hinweis 1 nutzen (−15 Punkte)</button>
    <button class="ghost" onclick="hint(${n},2)">Hinweis 2 nutzen (−30 Punkte)</button>
    <p class="muted">Fehlversuche: ${s.attempts[n]||0}</p>
  </section>`
}

function hint(n,level){
  const s=load(),st=stations[n],key=n+"-"+level;
  if(!s.hints[key]){s.hints[key]=true;s.score=Math.max(0,s.score-(level===1?15:30));save(s)}
  alert(level===1?st.hint1:st.hint2);renderPuzzle(s,n)
}

function check(n){
  const s=load(),st=stations[n],v=norm(document.getElementById("answer").value);
  s.attempts[n]=(s.attempts[n]||0)+1;
  const ok=st.answers.some(a=>norm(a)===v);
  if(!ok){save(s);flash("bad","NOCH NICHT RICHTIG",()=>renderPuzzle(s,n));return}
  const earned=Math.max(40,st.maxPoints-(s.attempts[n]-1)*20);
  s.score+=earned;s.solved.push(n);save(s);
  flash("good",`RICHTIG<br><span style="font-size:.35em">+${earned} Punkte</span>`,()=>insight(s,n))
}

function insight(s,n){
  app.innerHTML=`
  <section class="card">
    <div class="eyebrow">Neue Erkenntnis</div>
    <h1 style="font-size:2.5rem">Eine weitere Spur</h1>
    <p class="lead">${stations[n].story}</p>
    <div class="status info">Noch ist nicht klar, was all diese Nachrichten miteinander verbindet.</div>
    <button onclick="next()">Weiter zur nächsten Spur</button>
  </section>`
}
function next(){
  const s=load();s.routeIndex++;
  if(s.routeIndex>=s.route.length){
    s.finished=true;s.finishedAt=Date.now();save(s);store(s);renderFinish(s)
  }else{save(s);renderMission(s)}
}
function store(s){
  const r=results(),i=r.findIndex(x=>x.id===s.id),entry={...s,duration:s.finishedAt-s.startedAt};
  if(i>=0)r[i]=entry;else r.push(entry);saveResults(r)
}
function renderFinish(s){
  app.innerHTML=`
  <section class="hero">
    <div class="eyebrow">Mission abgeschlossen</div>
    <h1>Das Geheimnis ist gelüftet</h1>
    <p class="lead">Ein Bürgerfest entsteht nicht durch eine einzelne Person. Vereine, Gewerbetreibende, Ehrenamtliche, Mitarbeitende der Stadt, Organisatoren, Besucher und viele weitere Menschen tragen gemeinsam dazu bei.</p>
    <p class="lead"><strong>Genauso konntet auch ihr diese Mission nur als Team lösen.</strong></p>
    <div class="grid two">
      <div class="status good">${s.score}<br><span class="small">Punkte</span></div>
      <div class="status info">${fmt(s.finishedAt-s.startedAt)}<br><span class="small">Zeit</span></div>
    </div>
    <div class="status good">Siegerehrung: Sonntag um 15:00 Uhr</div>
  </section>
  <section class="card">
    <h2>Kurzes Feedback</h2>
    <label>Wie hat es euch gefallen?
      <select id="rating">
        <option value="5">😍 Sehr gut</option><option value="4">🙂 Gut</option>
        <option value="3">😐 Okay</option><option value="2">🙁 Eher nicht</option>
        <option value="1">😞 Gar nicht</option>
      </select>
    </label>
    <label>Was war gut oder was sollen wir verbessern?<textarea id="feedback" placeholder="Ein kurzer Satz reicht."></textarea></label>
    <button onclick="feedback()">Feedback speichern</button>
    <a class="button secondary" href="${BASE_URL}?admin=1">Test-Auswertung öffnen</a>
  </section>`
}
function feedback(){
  const s=load();s.rating=document.getElementById("rating").value;s.feedback=document.getElementById("feedback").value.trim();
  save(s);store(s);alert("Danke für euer Feedback!")
}
function renderAdmin(){
  const r=results().sort((a,b)=>(b.score-a.score)||((a.duration||0)-(b.duration||0)));
  const rows=r.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.team)}</td><td>${esc(x.members)}</td><td>${x.score}</td><td>${fmt(x.duration||0)}</td><td>${x.rating||"–"}</td><td>${esc(x.feedback||"")}</td></tr>`).join("");
  app.innerHTML=`
  <section class="card">
    <div class="eyebrow">Test-Auswertung</div><h1 style="font-size:2.6rem">Ergebnisse</h1>
    <p class="muted">Diese Tabelle enthält nur Ergebnisse, die auf diesem Gerät gespeichert wurden.</p>
    <div style="overflow:auto"><table><thead><tr><th>#</th><th>Team</th><th>Namen</th><th>Punkte</th><th>Zeit</th><th>Bewertung</th><th>Feedback</th></tr></thead>
    <tbody>${rows||'<tr><td colspan="7">Noch keine Ergebnisse vorhanden.</td></tr>'}</tbody></table></div>
    <button class="danger" onclick="if(confirm('Alle Testergebnisse löschen?')){localStorage.removeItem(RESULTS_KEY);renderAdmin()}">Testergebnisse löschen</button>
    <a class="button secondary" href="${BASE_URL}">Zur Rallye</a>
  </section>`
}
start()
</script>
</body>
</html>
