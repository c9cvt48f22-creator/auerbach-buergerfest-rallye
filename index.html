<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Die Nachricht aus der Vergangenheit</title>
<style>
:root{--bg:#f3eee4;--card:#fffaf1;--ink:#2d2924;--accent:#a96f2d;--soft:#eadfcf;--ok:#dcebd9;--danger:#e9d3c9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
#app{max-width:780px;margin:auto;padding:12px 12px 88px}
.card{background:var(--card);border-radius:22px;padding:20px;box-shadow:0 4px 20px #00000012}
h1{font-size:clamp(30px,8vw,52px);line-height:1.05;margin:0 0 16px}
h2{font-size:clamp(23px,6vw,32px);margin:22px 0 10px}
h3{margin:12px 0 7px}
p{font-size:17px;line-height:1.48}
button,input,select,textarea{font:inherit}
button{border:0;border-radius:13px;background:var(--soft);color:var(--ink);padding:11px 14px;margin:4px;cursor:pointer}
button.primary{background:var(--accent);color:white}
button.bonus{background:#d8b56f}
button:disabled{opacity:.45}
input,select,textarea{width:100%;padding:11px;border:1px solid #cdbfa9;border-radius:10px;background:#fff;margin:5px 0 10px}
.info,.clue,.warning,.success,.bonusbox{padding:13px 15px;border-radius:13px;margin:11px 0;background:#eee4d4}
.warning{background:#f4dfb5}.success{background:var(--ok)}.bonusbox{background:#ead5a4}
.big{font-size:20px;font-weight:700}.center{text-align:center}.hidden{display:none!important}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.6}
.score{font-weight:700}
.bottom{position:fixed;z-index:10;left:50%;transform:translateX(-50%);bottom:9px;width:min(760px,calc(100% - 18px));display:flex;justify-content:flex-end;gap:4px;pointer-events:none}
.bottom button{pointer-events:auto;font-size:12px;padding:8px 10px;margin:0;box-shadow:0 2px 10px #0002}
.bottom .skip{background:#ded4c4}
.puzzle{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;max-width:520px;margin:15px auto}
.piece{padding:0;margin:0;aspect-ratio:1;border-radius:2px;background-repeat:no-repeat;background-color:#ddd}
.piece.selected{outline:4px solid var(--accent);z-index:2}
.row{padding:10px;background:#f0e7d9;border-radius:11px;margin:7px 0}
.statement{display:block;width:100%;text-align:left}
.statement.selected{outline:3px solid var(--accent)}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.grid4 button{margin:0;padding:7px}
.fakeimg{aspect-ratio:4/3;border-radius:9px;background:linear-gradient(145deg,#d9d0c1,#f5eee4);display:flex;align-items:center;justify-content:center;font-size:28px}
.wordgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:2px}
.letter{padding:0;margin:0;border-radius:4px;aspect-ratio:1;font-weight:700;background:#e8dece}
.letter.selected{background:var(--accent);color:#fff}
.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.memorycard{aspect-ratio:1;padding:3px;margin:0;font-size:14px;font-weight:700}
.memorycard.open,.memorycard.matched{background:#e2c78f}
.memorycard.matched{outline:3px solid #78906e}
.order{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center}
@media(max-width:560px){.grid4{grid-template-columns:1fr 1fr}.memory{grid-template-columns:repeat(4,1fr)}}
@media(max-width:420px){p{font-size:16px}.bottom button{font-size:11px;padding:7px}.memorycard{font-size:12px}}
</style>
</head>

function norm(s){return String(s||"").toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\u00df/g,"ss").replace(/\s+/g," ")}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function setScore(){let e=document.getElementById("score");if(e)e.textContent=state.score}
function points(n){state.score+=n;setScore()}
function solve(id){if(!state.solved.has(id)){state.solved.add(id);points(10)}alert("Geschafft! +10 Punkte");next()}
function next(){showOverview()}
function showOverview(){
 const regular=stationOrder.slice(0,9);
 const allDone=regular.every(x=>state.solved.has(x[0]));
 document.getElementById("app").innerHTML=`<div class="card"><div class="eyebrow">Stadtrallye</div><h1>Welche Spur m&ouml;chtet ihr als N&auml;chstes l&ouml;sen?</h1><p>Die R&auml;tsel k&ouml;nnen in beliebiger Reihenfolge gel&ouml;st werden. Das Finale wird erst freigeschaltet, wenn alle neun vorherigen Spuren gel&ouml;st oder &uuml;bersprungen wurden.</p><div class="stationlist">${regular.map(x=>`<button onclick="render('${x[0]}')">${x[1]} ${state.solved.has(x[0])?"&#10003;":""}</button>`).join("")}${allDone?`<button class="primary" onclick="render('finale')">Das gro&szlig;e Finale</button>`:`<button disabled>Das gro&szlig;e Finale ist noch gesperrt</button>`}</div><p class="score">Punkte: ${state.score}</p></div>`;
}
function bottom(id){
return `<div class="bottom">
<button onclick="notes()">\ud83d\udcdd</button>
<button onclick="pause()">\u23f8 Pause</button>
<button onclick="hint('${id}')">\ud83d\udca1 Hinweis</button>
<button class="skip" onclick="skip()">Aufgabe \u00fcberspringen</button>
</div>`;
}
function skip(){
if(state.current==="finale"){alert("Das Finale muss gespielt werden.");return}
if(confirm("Aufgabe wirklich \u00fcberspringen? Es gibt daf\u00fcr keine Punkte."))next();
}
function pause(){
const o=document.createElement("div");o.className="overlay";o.style="position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px";
o.innerHTML='<div class="card" style="max-width:450px;width:100%"><h2>Pause</h2><p>Die Rallye ist pausiert.</p><button class="primary" onclick="this.closest(\'.overlay\').remove()">Weiter</button></div>';
document.body.appendChild(o);
}
function notes(){
const o=document.createElement("div");o.className="overlay";o.style="position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px";
o.innerHTML=`<div class="card" style="max-width:450px;width:100%"><h2>Notizen</h2><textarea id="notesText" rows="7" placeholder="Hier k\u00f6nnt ihr etwas notieren...">${state.notes}</textarea><button class="primary" onclick="state.notes=document.getElementById('notesText').value;this.closest('.overlay').remove()">Speichern</button></div>`;
document.body.appendChild(o);
}
function hint(id){
const h={
wappen:"Setzt zuerst die zw\u00f6lf Teile zusammen. Danach m\u00fcsst ihr die drei Berge nennen.",
berg:"Bei Caesar wird jeder Buchstabe um dieselbe Anzahl Stellen verschoben.",
jahre:"Vergleicht die Ereignisse genau. Einige Jahreszahlen liegen nur wenige Jahre auseinander.",
loewe:"Beginnt mit Tisch 6 und Tisch 8. Nutzt danach Ausschlusslogik.",
stromer:"Die Geschichte enth\u00e4lt die zeitlichen Anhaltspunkte.",
ochse:"Bei jeder Person ist nur eine Erinnerung richtig.",
buch:"Sucht Begriffe, die ihr schon aus Auerbach und der Rallye kennt.",
kirche:"Schaut euch die vier Bilder genau an. Die Spur wird nicht genannt.",
brunnen:"Punkt und Strich ergeben im Morsealphabet Buchstaben.",
finale:"Im Memory bleiben richtige Paare offen. Das Finale kann nicht \u00fcbersprungen werden."
};
points(-1);alert(h[id]||"Schaut noch einmal genau hin.");
}
function bonusButton(id,label){return `<button class="bonus" onclick="bonusTask('${id}')">Bonus: ${label}</button>`}
function bonusTask(id){
if(state.bonus.has(id)){alert("Diese Bonusaufgabe wurde schon gel\u00f6st.");return}
const b={
wappen:{q:"Bonus: Welche drei Berge sind auf dem Wappen?",a:"Gottvaterberg, Gr\u00fcnberg und Pinzigberg"},
berg:{q:"Bonus: Was bedeutet \u201eGl\u00fcck auf\u201c?",a:"Der traditionelle Gru\u00df der Bergleute."},
jahre:{q:"Bonus: Welche zwei Ereignisse liegen zeitlich am engsten beieinander?",a:"1430 und 1434"},
loewe:{q:"Bonus: Was w\u00fcrdet ihr als n\u00e4chsten logischen Hinweis in ein 4\u00d74-R\u00e4tsel schreiben?",a:"Zum Beispiel: Der Gast zwei Tische weiter sitzt an Tisch 8."},
stromer:{q:"Bonus: Womit ist Heinrich Stromer au\u00dferdem verbunden?",a:"Mit Auerbachs Keller."},
ochse:{q:"Bonus: Welches Tier lebt heute auf den Grubenfeldern?",a:"Heckrinder."},
buch:{q:"Bonus: Nennt einen Begriff aus dem Buchstabensalat, der mit Engagement zu tun hat.",a:"Ehrenamt."},
kirche:{q:"Bonus: Wo befindet sich der zweite Erzaltar?",a:"New York."},
brunnen:{q:"Bonus: Was wurde im Morsecode bestellt?",a:"Brot."}
}[id];
if(!b)return;
const a=prompt(b.q);
if(norm(a)===norm(b.a)){state.bonus.add(id);points(5);alert("Bonus geschafft! +5 Punkte")}else alert("Noch nicht ganz.");
}

function taskWappen(t){
state.wappen=shuffle([...Array(12).keys()]);state.wsel=null;
t.innerHTML=`<div class="eyebrow">Erste Spur</div><h1>Das Stadtwappen</h1>
<p>Aus der Vergangenheit wurde eine Nachricht in zw\u00f6lf Teile zerlegt. Euer erster Teil versteckt sich in einem Zeichen Auerbachs.</p>
<p>Setzt die zw\u00f6lf Teile des Wappens zusammen.</p>
<div id="wp" class="puzzle"></div>
<div id="wq" class="hidden"><div class="success"><strong>Das Wappen ist vollst\u00e4ndig.</strong></div>
<p><strong>Wie hei\u00dfen die drei Berge auf dem Wappen?</strong></p>
<input id="b1" placeholder="Berg 1"><input id="b2" placeholder="Berg 2"><input id="b3" placeholder="Berg 3">
<button class="primary" onclick="checkW()">Antwort pr\u00fcfen</button>
${bonusButton("wappen","Bergnamen")}</div>${bottom("wappen")}`;
drawWappen();
}
function drawWappen(){document.getElementById("wp").innerHTML=state.wappen.map((p,i)=>{let x=p%4,y=Math.floor(p/4);return `<button class="piece ${state.wsel===i?"selected":""}" style="background-image:url('${WAPPEN}');background-size:400% 300%;background-position:${x*33.3333}% ${y*50}%" onclick="wclick(${i})"></button>`}).join("")}
function wclick(i){
if(state.wsel===null){state.wsel=i;drawWappen();return}
if(state.wsel===i){state.wsel=null;drawWappen();return}
let a=state.wsel;[state.wappen[a],state.wappen[i]]=[state.wappen[i],state.wappen[a]];state.wsel=null;drawWappen();
if(state.wappen.every((x,i)=>x===i))document.getElementById("wq").classList.remove("hidden");
}
function checkW(){let a=[1,2,3].map(i=>norm(document.getElementById("b"+i).value));let r=["Gottvaterberg","Gr\u00fcnberg","Pinzigberg"].map(norm);if(new Set(a).size===3&&r.every(x=>a.includes(x)))solve("wappen");else alert("Noch nicht. Pr\u00fcft die drei Bergnamen.");}

<input id="cs" type="number" min="1" max="25" placeholder="Verschiebung">
<input id="ca" placeholder="Entschl\u00fcsselte Nachricht">
<button class="primary" onclick="checkB()">Pr\u00fcfen</button>${bonusButton("berg","Bedeutung")}${bottom("berg")}`;
}
function checkB(){if(Number(document.getElementById("cs").value)===3&&norm(document.getElementById("ca").value)===norm("GLUECKAUF DIE SPUR FUEHRT WEITER"))solve("berg");else alert("Noch nicht. Probiert eine andere Verschiebung.");}

/* 3 */
function taskJahre(t){
const d=[["Auerbach wird Hauptstadt von Neub\u00f6hmen","1373"],["Auerbach wird M\u00fcnzst\u00e4tte","1390"],["Das gotische Rathaus wird errichtet","1418"],["Die Hussiten erreichen Auerbach","1430"],["Das Bergwerk am Arzberg wird errichtet","1434"],["Der Pfarrkirchturm wird errichtet","1441"]];
const y=shuffle(["1373","1390","1418","1430","1434","1441","1388","1392","1427","1438","1452","1461"]);
t.innerHTML=`<div class="eyebrow">Dritte Spur</div><h1>Auerbachs Jahreszahlen</h1><p>Ordnet die Ereignisse den richtigen Jahren zu. Einige Zahlen geh\u00f6ren zu keinem Ereignis.</p>${d.map((x,i)=>`<div class="row"><strong>${x[0]}</strong><select id="j${i}"><option value="">Jahr ausw\u00e4hlen</option>${y.map(z=>`<option>${z}</option>`).join("")}</select></div>`).join("")}<button class="primary" onclick="checkJ()">Pr\u00fcfen</button>${bonusButton("jahre","Zeitabstand")}${bottom("jahre")}`;
}
function checkJ(){let r=["1373","1390","1418","1430","1434","1441"];if(r.every((x,i)=>document.getElementById("j"+i).value===x))solve("jahre");else alert("Noch nicht. Die Jahreszahlen liegen teilweise sehr nah beieinander.");}

/* 4 */
function taskLoewe(t){
let g=["Anna","Ben","Clara","David"],T=["5","6","7","8"],E=["Braten","Suppe","Brotzeit","Fisch"],D=["Wasser","Bier","Saft","Schorle"];
t.innerHTML=`<div class="eyebrow">Vierte Spur</div><h1>Das R\u00e4tsel im Goldenen L\u00f6wen</h1><p>Vier G\u00e4ste, vier Tische, vier Essen und vier Getr\u00e4nke. Kombiniert die Hinweise.</p>
<div class="clue">Ben sitzt an Tisch 6.</div><div class="clue">Der Gast zwei Tische weiter sitzt an Tisch 8.</div><div class="clue">Clara sitzt direkt neben Ben.</div><div class="clue">An Tisch 5 gibt es Suppe.</div><div class="clue">An Tisch 8 gibt es Fisch.</div><div class="clue">Wer Braten bestellt, trinkt Bier.</div><div class="clue">Zur Brotzeit gibt es Wasser.</div><div class="clue">Anna trinkt keinen Alkohol.</div>
${g.map(x=>`<div class="row"><strong>${x}</strong><select id="lt${x}"><option>\u2013</option>${T.map(z=>`<option>${z}</option>`).join("")}</select><select id="le${x}"><option>\u2013</option>${E.map(z=>`<option>${z}</option>`).join("")}</select><select id="ld${x}"><option>\u2013</option>${D.map(z=>`<option>${z}</option>`).join("")}</select></div>`).join("")}
<button class="primary" onclick="checkL()">Pr\u00fcfen</button>${bonusButton("loewe","Zusatzhinweis")}${bottom("loewe")}`;
}
function checkL(){let r={Anna:["5","Suppe","Saft"],Ben:["6","Braten","Bier"],Clara:["7","Brotzeit","Wasser"],David:["8","Fisch","Schorle"]};let ok=Object.keys(r).every(g=>document.getElementById("lt"+g).value===r[g][0]&&document.getElementById("le"+g).value===r[g][1]&&document.getElementById("ld"+g).value===r[g][2]);if(ok)solve("loewe");else alert("Noch nicht. Nutzt die Hinweise Schritt f\u00fcr Schritt.");}

/* 5 */
function taskStromer(t){
let s=["Heinrich Stromer wird 1476 in Auerbach geboren.","Er geht nach Leipzig und beginnt dort seine akademische Laufbahn.","1508 wird er Rektor der Universit\u00e4t Leipzig.","1511 erh\u00e4lt er den Doktortitel der Medizin.","Sein Name bleibt mit Auerbachs Keller verbunden."];state.stromer=shuffle(s);
t.innerHTML=`<div class="eyebrow">F\u00fcnfte Spur</div><h1>Doktor Heinrich Stromer</h1><p>Lest zuerst die kurze Geschichte. Danach bringt die f\u00fcnf Schnipsel in die richtige Reihenfolge.</p><div class="info">Heinrich Stromer wurde 1476 in Auerbach geboren. Sein Weg f\u00fchrte ihn sp\u00e4ter nach Leipzig. Dort begann seine akademische Laufbahn. 1508 wurde er Rektor der Universit\u00e4t Leipzig. 1511 erhielt er den Doktortitel der Medizin. Sein Name blieb au\u00dferdem mit Auerbachs Keller verbunden.</div>
${state.stromer.map((x,i)=>`<div class="row"><select id="st${i}">${state.stromer.map((_,n)=>`<option value="${n}">${n+1}</option>`).join("")}</select> ${x}</div>`).join("")}<button class="primary" onclick="checkS()">Pr\u00fcfen</button>${bonusButton("stromer","Auerbachs Keller")}${bottom("stromer")}`;
}
function checkS(){let r=["Heinrich Stromer wird 1476 in Auerbach geboren.","Er geht nach Leipzig und beginnt dort seine akademische Laufbahn.","1508 wird er Rektor der Universit\u00e4t Leipzig.","1511 erh\u00e4lt er den Doktortitel der Medizin.","Sein Name bleibt mit Auerbachs Keller verbunden."];if(state.stromer.every((x,i)=>r[Number(document.getElementById("st"+i).value)]===x))solve("stromer");else alert("Die Reihenfolge stimmt noch nicht.");}

/* 6 */
function taskOchse(t){
let p=[["Anna","Der Auerochse geh\u00f6rt zum Auerbacher Stadtwappen.","Der Auerochse wurde erst vor wenigen Jahren zum Wappentier."],["Jakob","Die Grubenfelder Leonie geh\u00f6ren zur Auerbacher Bergbaugeschichte.","Die Grubenfelder Leonie haben mit dem Bergbau nichts zu tun."],["Clara","Auf den Grubenfeldern leben Heckrinder.","Auf den Grubenfeldern leben heute noch echte wilde Auerochsen."],["Max","Der Auerochse ist Teil der Geschichte Auerbachs.","Der Auerochse hat mit Auerbach \u00fcberhaupt nichts zu tun."]];
t.innerHTML=`<div class="eyebrow">Sechste Spur</div><h1>Das Auerochsen-R\u00e4tsel</h1><p>Vier Menschen erinnern sich. Bei jeder Person ist nur eine Aussage richtig.</p>${p.map((x,i)=>`<div class="row"><h3>${x[0]}</h3><button class="statement" data-p="${i}" data-a="A" onclick="selO(this)">A: ${x[1]}</button><button class="statement" data-p="${i}" data-a="B" onclick="selO(this)">B: ${x[2]}</button></div>`).join("")}<button class="primary" onclick="checkO()">Pr\u00fcfen</button>${bonusButton("ochse","Heckrinder")}${bottom("ochse")}`;
}
function selO(b){document.querySelectorAll('.statement[data-p="'+b.dataset.p+'"]').forEach(x=>x.classList.remove("selected"));b.classList.add("selected")}
function checkO(){let a=[...document.querySelectorAll(".statement.selected")];if(a.length===4&&a.every(x=>x.dataset.a==="A"))solve("ochse");else alert("Vergleicht die vier Erinnerungen noch einmal.");}

/* 7 */
function taskBuch(t){
let words=["AUERBACH","BERGBAU","BURGERFEST","VEREIN","MARKT","GLUECKAUF","WAPPEN","EHRENAMT","STROMER","GEMEINSCHAFT"];
let grid=["AUERBACHXYZK","QBERGBAUMNRS","TUVBURGERFEST","WXYZVEREINAB","GLUECKAUFCDR","WAPPENEFGHST","MARKTIJKLMNO","EHRENAMTPQRS","GEMEINSCHAFT","STROMERUVWXY","AABERGBBAUCD","FESTAUERBACH"].join("");state.bwords=words;
t.innerHTML=`<div class="eyebrow">Siebte Spur</div><h1>Die zerrissene Nachricht</h1><p>Die B\u00fccherei ist beim B\u00fcrgerfest geschlossen. Trotzdem hat sie eine Spur hinterlassen. Die Nachricht wurde in einzelne Teile zerlegt.</p><p>Findet Begriffe aus Auerbach, dem B\u00fcrgerfest und den bisherigen R\u00e4tseln.</p><div id="wg" class="wordgrid"></div><p>Markierte Buchstaben: <strong id="wc">0</strong></p><button class="primary" onclick="checkBu()">Pr\u00fcfen</button>${bonusButton("buch","Engagement")}${bottom("buch")}`;
document.getElementById("wg").innerHTML=grid.split("").map(x=>`<button class="letter" onclick="this.classList.toggle('selected');document.getElementById('wc').textContent=document.querySelectorAll('#wg .selected').length">${x}</button>`).join("");
}
function checkBu(){let s=[...document.querySelectorAll("#wg .selected")].map(x=>x.textContent).join("");if(state.bwords.filter(x=>s.includes(x)).length>=5)solve("buch");else alert("Findet noch weitere Begriffe.");}

/* 8 */
function taskKirche(t){
t.innerHTML=`<div class="eyebrow">Achte Spur</div><h1>Die Spur in der Kirche</h1><p>In der Kirche versteckt sich eine Spur aus der Auerbacher Bergbaugeschichte.</p><div class="warning"><strong>Wichtig:</strong> Wenn Gottesdienst ist, bleibt bitte drau\u00dfen und nutzt nur die Bilder.</div><p>Schaut euch vier Bereiche genau an. Die Aufgabe sagt euch nicht, wonach ihr suchen sollt.</p>
<div class="grid4">${[1,2,3,4].map(i=>`<button onclick="church(${i})"><div class="fakeimg">${["\u26ea","\ud83c\udfdb","\ud83d\udcdc","\u26cf"][i-1]}</div><strong>Bild ${i}</strong></button>`).join("")}</div>
<div id="cq" class="hidden"></div>${bonusButton("kirche","Erzaltar")}${bottom("kirche")}`;
}
function church(n){if(n!==1){alert("Noch nicht. Schaut euch jedes Bild genau an.");return}let q=document.getElementById("cq");q.classList.remove("hidden");q.innerHTML=`<div class="success"><p>Ihr habt die Spur entdeckt.</p><p>Nur zwei Erzalt\u00e4re dieser besonderen Art gibt es.</p><p><strong>Wo befindet sich der andere?</strong></p><button onclick="erz('Auerbach')">Auerbach</button><button onclick="erz('New York')">New York</button><button onclick="erz('London')">London</button><button onclick="erz('Rom')">Rom</button></div>`}
function erz(x){if(x==="New York")solve("kirche");else alert("Noch nicht.");}

/* 9 */
function taskBrunnen(t){
t.innerHTML=`<div class="eyebrow">Neunte Spur</div><h1>Der Markttag am Brunnen</h1><p>1144 wurde der Markt von Michelfeld nach Auerbach verlegt. H\u00e4ndler, Handwerker und Besucher kamen zusammen.</p><p>Eine Bestellung sollte schnell weitergegeben werden.</p><div class="info"><strong>Geheime Bestellung:</strong><p class="big center">-... .-. --- -</p></div><p>Entschl\u00fcsselt die Bestellung mit dem Morsealphabet.</p><input id="morse" placeholder="Was wurde bestellt?"><button class="primary" onclick="checkM()">Pr\u00fcfen</button>${bonusButton("brunnen","Markt")}${bottom("brunnen")}`;
}
function checkM(){if(norm(document.getElementById("morse").value)==="brot")solve("brunnen");else alert("Noch nicht. Punkt f\u00fcr Punkt und Strich f\u00fcr Strich.");}

/* 10 */
function taskFinale(t){
t.innerHTML=`<div class="eyebrow">Zehnte und letzte Station</div><h1>Die zw\u00f6lf Teile</h1><p>Jetzt setzt ihr die Nachricht aus der Vergangenheit zusammen.</p><div class="info"><strong>Das Finale kann nicht \u00fcbersprungen werden.</strong><p>Deckt immer zwei Karten auf. Passen sie zusammen, bleiben sie offen. Bei einem falschen Paar werden beide wieder umgedreht.</p></div><div id="mem" class="memory"></div><div id="finalMessage" class="hidden"></div>`;
startMemory();
}
function startMemory(){
let p=[["\ud83c\udfdb","AUERBACH"],["\u26cf","BERGBAU"],["\ud83d\udc36","AUEROCHSE"],["\ud83d\udcdc","GESCHICHTE"],["\ud83e\udd84","GOLDENER L\u00d6WE"],["\u26ea","ERZALTAR"],["\u26f2","MARKT"],["\ud83d\udcda","B\u00dcCHEREI"],["\ud83d\udc69\u200d\u2695","STROMER"],["\ud83e\udd1d","ZUSAMMENHALT"],["\ud83c\udf89","B\u00dcRGERFEST"],["\u2764","ENGAGEMENT"]];
state.mem=shuffle(p.flatMap((x,i)=>[{p:i,t:x[0]},{p:i,t:x[1]}]));state.mo=[];state.match=[];drawMem();
}
function drawMem(){document.getElementById("mem").innerHTML=state.mem.map((x,i)=>`<button class="memorycard" id="m${i}" onclick="flip(${i})">?</button>`).join("")}
function flip(i){if(state.match.includes(i)||state.mo.includes(i)||state.mo.length===2)return;document.getElementById("m"+i).innerHTML=state.mem[i].t;document.getElementById("m"+i).classList.add("open");state.mo.push(i);if(state.mo.length===2)setTimeout(checkMem,650)}
function checkMem(){let[a,b]=state.mo;if(state.mem[a].p===state.mem[b].p){document.getElementById("m"+a).classList.add("matched");document.getElementById("m"+b).classList.add("matched");state.match.push(a,b);state.mo=[];if(state.match.length===state.mem.length){points(50);finish()}}else{document.getElementById("m"+a).textContent="?";document.getElementById("m"+b).textContent="?";document.getElementById("m"+a).classList.remove("open");document.getElementById("m"+b).classList.remove("open");state.mo=[]}}
function finish(){document.getElementById("finalMessage").classList.remove("hidden");document.getElementById("finalMessage").innerHTML=`<div class="success"><h2>Die Nachricht ist vollst\u00e4ndig.</h2><p class="big">Zusammenhalt kann viel bewegen.</p><p>Ein B\u00fcrgerfest entsteht nicht von allein. Es lebt durch Vereine, Gewerbetreibende, Ehrenamtliche, Organisatoren und Besucher.</p><p>Jeder kann einen Teil beitragen: in einem Verein, bei einem Hobby, mit einer Idee oder einfach dadurch, dass man sich f\u00fcr seine Stadt engagiert.</p><p class="big">Alleine kann man etwas beginnen.<br>Gemeinsam kann man etwas bewegen.</p><h2>AUERBACH LEBT DURCH EUCH. \u2764</h2><p>Gesamtpunktzahl: <strong>${state.score}</strong></p></div>`}
function render(id){
state.current=id;let s=stationOrder.find(x=>x[0]===id);document.getElementById("app").innerHTML=`<div class="top"><div><div class="eyebrow">Stadtrallye</div><strong>${s?s[1]:""}</strong></div><div class="score">\u2b50 <span id="score">${state.score}</span></div></div><div class="card" id="card"></div>`;
if(id==="wappen")taskWappen(card);else if(id==="berg")taskBergleute(card);else if(id==="jahre")taskJahre(card);else if(id==="loewe")taskLoewe(card);else if(id==="stromer")taskStromer(card);else if(id==="ochse")taskOchse(card);else if(id==="buch")taskBuch(card);else if(id==="kirche")taskKirche(card);else if(id==="brunnen")taskBrunnen(card);else taskFinale(card);
}
function intro(){document.getElementById("app").innerHTML=`<div class="card"><div class="eyebrow">Stadtrallye B\u00fcrgerfest</div><h1>Die Nachricht aus der Vergangenheit</h1><p>Aus der Vergangenheit wurde eine Nachricht in zw\u00f6lf Teilen \u00fcbermittelt. Eure Aufgabe: Findet die Spuren, l\u00f6st die R\u00e4tsel und setzt am Ende die geheime Botschaft zusammen.</p><div class="info"><strong>Was einer beginnt, k\u00f6nnen viele vollenden.</strong></div><button class="primary" onclick="render('wappen')">Rallye beginnen</button></div>`}
intro();
</script>
</body>
</html>
