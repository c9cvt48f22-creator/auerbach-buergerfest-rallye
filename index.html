<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7c2b3a">
<title>Das Geheimnis des Bürgerfests</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
:root{
  --navy:#18324a;--wine:#842c3d;--gold:#d3a23d;--cream:#fff9ef;
  --paper:#fffdf8;--line:#dfd0ba;--text:#263442;--muted:#697586;
  --green:#248653;--red:#c62828;--blue:#3568c7
}
*{box-sizing:border-box}
body{
  margin:0;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  background:radial-gradient(circle at 10% 5%,#f3d89c55,transparent 24rem),
  linear-gradient(180deg,var(--cream),#f3e4cc)
}
header{
  position:sticky;top:0;z-index:50;padding:13px 16px;color:white;
  background:linear-gradient(135deg,var(--navy),#265274);box-shadow:0 5px 18px #0003
}
.head{max-width:820px;margin:auto;display:flex;align-items:center;gap:13px}
.brand{
  width:64px;height:58px;border:2px solid var(--gold);border-radius:15px;
  display:grid;place-items:center;background:var(--wine);position:relative
}
.brand:before{
  content:"";width:32px;height:27px;border:3px solid white;border-top:0;
  clip-path:polygon(0 40%,50% 0,100% 40%,100% 100%,0 100%)
}
.brand:after{
  content:"🧩";position:absolute;right:-8px;bottom:-7px;background:var(--gold);
  width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:15px
}
header strong{display:block} header small{color:#ebdfcf}
main{max-width:820px;margin:auto;padding:18px}
.card,.hero{
  background:#fffdf8f7;border:1px solid var(--line);border-radius:22px;
  padding:23px;margin:16px 0;box-shadow:0 15px 34px #46351e1c
}
.hero{background:linear-gradient(135deg,#fffefa,#fff2dc);overflow:hidden;position:relative}
.hero:after{content:"?";position:absolute;right:-10px;bottom:-80px;font:700 270px Georgia;color:#842c3d0c}
.eyebrow{color:var(--wine);font-weight:900;letter-spacing:.09em;text-transform:uppercase}
h1,h2,h3{color:var(--navy)}
h1{font:700 clamp(2.3rem,8vw,4rem)/1.04 Georgia;margin:.25em 0}
h2{font:700 1.7rem Georgia}
p{line-height:1.58}.lead{font-size:1.17rem}.muted{color:var(--muted)}.small{font-size:.9rem}
.grid{display:grid;gap:14px}.two{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.feature{padding:16px;border:1px solid var(--line);border-radius:16px;background:#fff8ec}
label{display:block;margin-top:14px;font-weight:700}
input,textarea,select{
  width:100%;margin-top:7px;padding:14px;border:1px solid #b8a98f;
  border-radius:12px;background:white;font-size:1rem
}
textarea{min-height:92px}
button,.btn{
  width:100%;display:inline-block;margin-top:11px;padding:15px 18px;border:0;
  border-radius:14px;background:linear-gradient(135deg,var(--wine),#b13d51);
  color:white;font-weight:900;text-align:center;text-decoration:none;cursor:pointer
}
.secondary{background:var(--navy)}.light{background:#eee0ca;color:var(--navy)}.danger{background:var(--red)}
.status{padding:15px;border-radius:14px;color:white;text-align:center;font-weight:800;margin:13px 0}
.info{background:var(--blue)}.good{background:var(--green)}.bad{background:var(--red)}
.timer{font-size:2rem;font-weight:1000;color:var(--navy);font-variant-numeric:tabular-nums}
.score{font-size:1.65rem;font-weight:1000;color:var(--wine)}
.progress{height:12px;border-radius:99px;background:#e8d8c0;overflow:hidden}
.progress div{height:100%;background:linear-gradient(90deg,var(--gold),#f0c35f)}
.flash{
  position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
  padding:28px;color:white;text-align:center;font-size:clamp(2rem,10vw,5rem);font-weight:1000
}
.flash.good{background:var(--green)}.flash.bad{background:var(--red)}
#reader{width:100%;overflow:hidden;border-radius:15px;background:white}
.scanner{padding:14px;border:2px dashed var(--gold);border-radius:17px;background:#fff8ea}
.morse{display:grid;grid-template-columns:repeat(auto-fit,minmax(85px,1fr));gap:6px}
.morse div{padding:8px 4px;border:1px solid var(--line);border-radius:8px;background:white;text-align:center;font-family:monospace}
.puzzle{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-width:460px;margin:18px auto;background:#ddd;padding:4px}
.tile{aspect-ratio:1;border:0;border-radius:0;margin:0;padding:0;background-repeat:no-repeat;background-size:400% 300%;box-shadow:none}
.tile.selected{outline:5px solid var(--gold);z-index:2}
.timeline{display:grid;gap:11px}.event{padding:13px;border:1px solid var(--line);border-radius:13px;background:#fff8ec}
table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left}.scroll{overflow:auto}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.qrcard{padding:15px;border:1px solid var(--line);border-radius:15px;background:white}.qr{display:grid;place-items:center;min-height:180px}
footer{max-width:820px;margin:auto;padding:20px;text-align:center;color:#6c6257}
@media print{header,footer,.noprint{display:none!important}.card{box-shadow:none;page-break-inside:avoid}}
</style>
</head>

function flash(type,text,cb){
 const d=document.createElement("div");d.className="flash "+type;d.innerHTML=text;document.body.appendChild(d);

}

function begin(){
 const team=$("team").value.trim(),members=$("members").value.trim();
 if(!team||!members)return alert("Bitte Teamname und Vornamen eintragen.");

 const s={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),team,members,consent:$("consent").value,
 route:ROUTES[Math.floor(Math.random()*ROUTES.length)],pos:0,start:Date.now(),score:0,tries:{},hints:{},solved:[],finished:false};

}

let scanner=null,busy=false;
function openScanner(){
 app.innerHTML=`<section class="card"><div class="eyebrow">QR-Scanner</div><h2>Stationscode scannen</h2><div class="scanner"><div id="reader"></div><p class="muted small">Safari fragt beim ersten Mal nach der Kamera. Bitte „Erlauben“ wählen.</p></div><button class="secondary" onclick="closeScanner()">Scanner schließen</button></section>`;
 if(typeof Html5Qrcode==="undefined"){alert("Scanner konnte nicht geladen werden.");return mission(load())}
 scanner=new Html5Qrcode("reader");busy=false;
 scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:240,height:240}},text=>{
  if(busy)return;busy=true;let n=null;try{n=Number(new URL(text,location.href).searchParams.get("station"))}catch{}
  stopScanner().then(()=>n?checkStation(load(),n):flash("bad","UNGÜLTIGER QR-CODE",()=>mission(load())))
 },()=>{}).catch(()=>{alert("Kamera konnte nicht geöffnet werden.");mission(load())})
}
async function stopScanner(){if(!scanner)return;try{if(scanner.isScanning)await scanner.stop();await scanner.clear()}catch{}scanner=null}
async function closeScanner(){await stopScanner();mission(load())}
function scanTest(n){checkStation(load(),n)}
function checkStation(s,n){
 if(n!==current(s))return flash("bad","FALSCHER QR-CODE<br><span style='font-size:.34em'>Diese Station gehört noch nicht zu eurer Route.</span>",()=>mission(s));
 flash("good","STATION GEFUNDEN",()=>showTask(s,n))
}

function showTask(s,n){
 const type=STATIONS[n].type;
 if(type==="coat")showCoat(s,n);
 if(type==="morse")showMorse(s,n);
 if(type==="time")showTime(s,n)
}

let order=[9,2,7,0,11,5,3,8,1,10,6,4],selected=null;
function showCoat(s,n){
 app.innerHTML=`
 <section class="card"><div class="eyebrow">Station ${s.pos+1} von ${s.route.length}</div><h1 style="font-size:2.5rem">Das Auerbacher Stadtwappen</h1>

  <button class="light" onclick="useHint(${n},1)">Hinweis 1 (−15 Punkte)</button>

  <button class="danger" onclick="skipStation(${n})">Aufgabe überspringen (−100 Punkte)</button>
 </section>`;
 drawPuzzle()
}
function drawPuzzle(){
 $("puzzle").innerHTML=order.map((piece,pos)=>{
  const row=Math.floor(piece/4),col=piece%4;
  return `<button class="tile ${selected===pos?"selected":""}" style="background-image:url('${WAPPEN}');background-position:${col*(100/3)}% ${row*50}%" onclick="pickTile(${pos})" aria-label="Puzzleteil"></button>`
 }).join("")
}
function pickTile(pos){
 if(selected===null){selected=pos;drawPuzzle();return}
 [order[selected],order[pos]]=[order[pos],order[selected]];selected=null;drawPuzzle()
}
function checkPuzzle(n){
 const s=load();s.tries[n]=(s.tries[n]||0)+1;
 if(!order.every((x,i)=>x===i)){save(s);return flash("bad","NOCH NICHT RICHTIG",()=>showCoat(s,n))}
 showMountains(s,n)
}
function showMountains(s,n){
 app.innerHTML=`<section class="card"><div class="eyebrow">Zweiter Teil</div><h2>Die drei Berge</h2>
 <p>Der Auerochse steht auf einem grünen Dreiberg. Wie heißen die drei Berge, die damit der Überlieferung nach verbunden werden?</p>
 <label>Berg 1<input id="m1"></label><label>Berg 2<input id="m2"></label><label>Berg 3<input id="m3"></label>
 <p class="muted small">Die Reihenfolge spielt keine Rolle.</p>
 <button onclick="checkMountains(${n})">Antworten prüfen</button>
 <button class="light" onclick="mountainHint(1)">Hinweis 1 (−15 Punkte)</button>
 <button class="light" onclick="mountainHint(2)">Hinweis 2 (−25 Punkte)</button>
 <button class="danger" onclick="skipStation(${n})">Aufgabe überspringen (−100 Punkte)</button></section>`
}
function checkMountains(n){
 const s=load(),a=[$("m1").value,$("m2").value,$("m3").value].map(norm);
 const groups=[["gottvaterberg"],["pinzigberg"],["grunberg","gaasberg","gaasberch"]];
 const ok=groups.every(g=>g.some(x=>a.includes(norm(x))));
 if(!ok){s.tries[n]=(s.tries[n]||0)+1;save(s);return flash("bad","NOCH NICHT RICHTIG",()=>showMountains(s,n))}
 success(s,n)
}
function mountainHint(level){
 const s=load(),n=1,key="mountain-"+level;if(!s.hints[key]){s.hints[key]=1;s.score=Math.max(0,s.score-(level===1?15:25));save(s)}
 alert(level===1?"Einer der Namen erinnert an eine religiöse Bezeichnung, ein weiterer beginnt mit P.":"Der dritte Name enthält eine Farbe; eine überlieferte alternative Form beginnt mit Gaa.")
}

function morseTable(){return Object.entries(MORSE).map(([a,c])=>`<div><b>${a}</b><br>${c}</div>`).join("")}
function showMorse(s,n){
 const st=STATIONS[n];
 app.innerHTML=`<section class="card"><div class="eyebrow">Station ${s.pos+1} von ${s.route.length}</div><h1 style="font-size:2.5rem">${st.title}</h1>
 <div class="status info" style="font:700 1.25rem monospace">${st.code}</div>
 <p>Leerzeichen trennen Buchstaben, der Schrägstrich trennt Wörter.</p><h3>Morse-Alphabet</h3><div class="morse">${morseTable()}</div>
 <label>Entschlüsselte Nachricht<input id="answer" autocomplete="off"></label>
 <button onclick="checkText(${n})">Antwort prüfen</button>
 <button class="light" onclick="useHint(${n},1)">Hinweis 1 (−15 Punkte)</button>
 <button class="light" onclick="useHint(${n},2)">Hinweis 2 (−25 Punkte)</button>
 <button class="danger" onclick="skipStation(${n})">Aufgabe überspringen (−100 Punkte)</button></section>`
}
function checkText(n){
 const s=load(),st=STATIONS[n];s.tries[n]=(s.tries[n]||0)+1;
 if(!st.answers.some(x=>norm(x)===norm($("answer").value))){save(s);return flash("bad","NOCH NICHT RICHTIG",()=>showMorse(s,n))}
 success(s,n)
}

function yearSelect(id){
 const jahre=["1373","1275","1390","1314"];
 return `<select id="${id}"><option value="">Jahr auswählen</option>${jahre.map(x=>`<option>${x}</option>`).join("")}</select>`
}
function showTime(s,n){
 app.innerHTML=`<section class="card"><div class="eyebrow">Station ${s.pos+1} von ${s.route.length}</div><h1 style="font-size:2.5rem">${STATIONS[n].title}</h1>
 <p class="lead">Ordnet jedem Ereignis das richtige Jahr zu.</p><div class="timeline">
 <div class="event"><b>Erste archivarische Aufzeichnung über Feuerstellen für Eisenschmelzen</b>${yearSelect("y1")}</div>
 <div class="event"><b>Auerbach erhält die Stadtrechte</b>${yearSelect("y2")}</div>
 <div class="event"><b>Auerbach wird Hauptstadt „Neuböhmens“ und Sitz eines eigenen Landgerichts</b>${yearSelect("y3")}</div>
 <div class="event"><b>In Auerbach besteht eine Münzstätte</b>${yearSelect("y4")}</div></div>
 <button onclick="checkTime(${n})">Zuordnung prüfen</button>
 <button class="light" onclick="useHint(${n},1)">Hinweis 1 (−15 Punkte)</button>
 <button class="light" onclick="useHint(${n},2)">Hinweis 2 (−25 Punkte)</button>
 <button class="danger" onclick="skipStation(${n})">Aufgabe überspringen (−100 Punkte)</button></section>`
}
function checkTime(n){
 const s=load();s.tries[n]=(s.tries[n]||0)+1;
 const ok=$("y1").value==="1275"&&$("y2").value==="1314"&&$("y3").value==="1373"&&$("y4").value==="1390";
 if(!ok){save(s);return flash("bad","NOCH NICHT RICHTIG",()=>showTime(s,n))}
 success(s,n)
}


function skipStation(n){
 const ersteBestaetigung=confirm(
  "Diese Aufgabe wirklich überspringen?\n\nDafür werden 100 Punkte abgezogen und die Station gilt als nicht gelöst."
 );
 if(!ersteBestaetigung)return;

 const zweiteBestaetigung=confirm(
  "Letzte Bestätigung:\n\nWollt ihr endgültig überspringen und 100 Punkte verlieren?"
 );
 if(!zweiteBestaetigung)return;

 const s=load();
 s.score-=100;
 s.skipped=s.skipped||[];
 if(!s.skipped.includes(n))s.skipped.push(n);
 save(s);

 flash(
  "bad",
  "AUFGABE ÜBERSPRUNGEN<br><span style='font-size:.34em'>−100 Punkte</span>",
  ()=>skippedInsight(s,n)
 );
}

function skippedInsight(s,n){
 app.innerHTML=`<section class="card">
  <div class="eyebrow">Station übersprungen</div>
  <h1 style="font-size:2.6rem">Die Spur bleibt unvollständig</h1>
  <p class="lead">Ihr dürft eure Mission fortsetzen. Für die Gesamtwertung wurden 100 Punkte abgezogen.</p>
  <p class="muted">Die Erklärung dieser Station wird nicht vollständig angezeigt, damit das Überspringen keine kostenlose Lösung verrät.</p>
  <button onclick="nextStation()">Weiter zur nächsten Spur</button>
 </section>`
}

function useHint(n,level){
 const s=load(),key=n+"-"+level;if(!s.hints[key]){s.hints[key]=1;s.score=Math.max(0,s.score-(level===1?15:25));save(s)}
 alert(level===1?STATIONS[n].h1:STATIONS[n].h2);showTask(s,n)
}
function success(s,n){
 const st=STATIONS[n],tries=s.tries[n]||1,earned=Math.max(50,st.points-(tries-1)*20);
 s.score+=earned;if(!s.solved.includes(n))s.solved.push(n);save(s);
 flash("good",`RICHTIG<br><span style="font-size:.35em">+${earned} Punkte</span>`,()=>insight(s,n))
}
function insight(s,n){
 app.innerHTML=`<section class="card"><div class="eyebrow">Neue Erkenntnis</div><h1 style="font-size:2.6rem">Eine weitere Spur</h1>
 <p class="lead">${STATIONS[n].story}</p><div class="status info">Noch ist nicht klar, wie alle Nachrichten miteinander verbunden sind.</div>
 <button onclick="nextStation()">Weiter zur nächsten Spur</button></section>`
}
function nextStation(){
 const s=load();s.pos++;
 if(s.pos>=s.route.length){s.finished=true;s.end=Date.now();save(s);storeResult(s);return finish(s)}
 save(s);mission(s)
}

function storeResult(s){
 const r=loadResults(),i=r.findIndex(x=>x.id===s.id),entry={...s,duration:s.end-s.start};
 if(i>=0)r[i]=entry;else r.push(entry);saveResults(r)
}
function finish(s){
 app.innerHTML=`<section class="hero"><div class="eyebrow">Mission abgeschlossen</div><h1>Das Geheimnis<br>ist gelüftet</h1>
 <p class="lead">Ein Bürgerfest entsteht nicht durch eine einzelne Person. Vereine, Gewerbetreibende, Ehrenamtliche, Mitarbeitende der Stadt, Organisatoren, Besucher und viele weitere Menschen tragen gemeinsam dazu bei.</p>
 <p class="lead"><strong>Genauso konntet auch ihr diese Mission nur als Team lösen.</strong></p>
 <div class="grid two"><div class="status good">${s.score}<br><span class="small">Punkte</span></div><div class="status info">${format(s.end-s.start)}<br><span class="small">Zeit</span></div></div>
 <div class="status good">Siegerehrung: Sonntag um 15:00 Uhr</div></section>
 <section class="card"><h2>Kurzes Feedback</h2><label>Bewertung<select id="rating"><option value="5">😍 Sehr gut</option><option value="4">🙂 Gut</option><option value="3">😐 In Ordnung</option><option value="2">🙁 Eher nicht</option></select></label>
 <label>Was war gut oder soll verbessert werden?<textarea id="feedback"></textarea></label><button onclick="saveFeedback()">Feedback speichern</button></section>`
}
function saveFeedback(){const s=load();s.rating=$("rating").value;s.feedback=$("feedback").value.trim();save(s);storeResult(s);alert("Vielen Dank!")}

/* Veranstalterbereich nur über ?admin=1 und PIN */
function adminLogin(){
 app.innerHTML=`<section class="card"><div class="eyebrow">Geschützter Bereich</div><h1 style="font-size:2.6rem">Veranstalter-Anmeldung</h1>
 <label>PIN<input id="pin" type="password" inputmode="numeric"></label><button onclick="checkPin()">Öffnen</button><button class="secondary" onclick="location.href=BASE">Zur Rallye</button></section>`
}
function checkPin(){
 if($("pin").value!==ADMIN_PIN)return flash("bad","FALSCHE PIN",adminLogin);
 sessionStorage.setItem(ADMIN_SESSION,"yes");admin()
}
function admin(){
 const r=loadResults().sort((a,b)=>(b.score-a.score)||((a.duration||0)-(b.duration||0)));
 const rows=r.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.team)}</td><td>${esc(x.members)}</td><td>${x.score}</td><td>${format(x.duration||0)}</td><td>${(x.skipped||[]).length}</td><td>${x.rating||"–"}</td><td>${esc(x.feedback||"")}</td></tr>`).join("");
 const cards=Object.entries(STATIONS).map(([n,s])=>`<div class="qrcard"><div class="eyebrow">Station ${n}</div><h3>${s.title}</h3><div id="qr${n}" class="qr"></div><p>${s.admin}</p><p class="small">${BASE}?station=${n}</p></div>`).join("");
 app.innerHTML=`<section class="card"><div class="eyebrow">Nur für Veranstalter</div><h1 style="font-size:2.6rem">Ergebnisse</h1>
 <div class="scroll"><table><thead><tr><th>#</th><th>Team</th><th>Namen</th><th>Punkte</th><th>Zeit</th><th>Übersprungen</th><th>Bewertung</th><th>Feedback</th></tr></thead><tbody>${rows||'<tr><td colspan="8">Noch keine Ergebnisse</td></tr>'}</tbody></table></div></section>
 <section class="card"><h2>QR- und Stationsplan</h2><button class="secondary noprint" onclick="window.print()">QR-Codes drucken</button><div class="qrgrid">${cards}</div></section>
 <section class="card noprint"><button class="secondary" onclick="sessionStorage.removeItem(ADMIN_SESSION);location.href=BASE">Abmelden</button></section>`;
 if(typeof QRCode!=="undefined")Object.keys(STATIONS).forEach(n=>new QRCode($("qr"+n),{text:BASE+"?station="+n,width:170,height:170,correctLevel:QRCode.CorrectLevel.H}))
}

function start(){
 const q=new URLSearchParams(location.search);
 if(q.get("admin")==="1"){
  if(sessionStorage.getItem(ADMIN_SESSION)==="yes")admin();else adminLogin();
  return
 }
 const s=load();
 if(!s)return landing();
 if(s.finished)return finish(s);
 const n=stationParam();
 if(n){cleanUrl();return checkStation(s,n)}
 mission(s)
}
start();
</script>
</body>
</html>
