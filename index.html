function flash(type,text,cb){

  const d=document.createElement("div");

  d.className="flash "+type;

  d.innerHTML=text;

  document.body.appendChild(d);

  if(navigator.vibrate){

    navigator.vibrate(
      type==="bad"
        ?[180,80,180]
        :120
    );

  }

  setTimeout(()=>{

    d.remove();

    if(cb){
      cb();
    }

  },1300);

}

function begin(){

  const members=

    alert(
      "Bitte Teamname und Vornamen eintragen."

  }


  /*
    Eine der vorbereiteten Routen wird
    zufällig ausgewählt.

    Dadurch startet nicht jedes Team
    an derselben Station.
  */

  const route=
    ROUTES[
      Math.floor(
        Math.random()*ROUTES.length
      )
    ];

/* ============================================================

   ============================================================ */

function elapsed(s){

  return Date.now()

    -s.start

    -(s.pausedMs||0)

    -(

      s.pause?.active

        ?Date.now()-
         s.pause.startedAt

        :0

    );

}


function startTimer(){

  clearInterval(
    window.rallyTimer
  );


  window.rallyTimer=
    setInterval(()=>{

      const s=
        load();


      const timer=
        $("timer");


      if(
        s &&
        timer
      ){

        timer.textContent=
          format(
            elapsed(s)
          );

      }

    },1000);

}

/* ============================================================
   PAUSEN-TIMER
   ============================================================ */

function updatePause(){

  clearInterval(
    window.rallyTimer
  );


  window.rallyTimer=
    setInterval(()=>{

      const s=
        load();


      if(
        !s?.pause?.active
      ){

        clearInterval(
          window.rallyTimer
        );

        return;

      }


      const remaining=
        Math.max(

          0,

          MIN_PAUSE -
          (
            Date.now() -
            s.pause.startedAt
          )

        );


      if(
        $("pauseRemain")
      ){

        $("pauseRemain")
          .textContent=
          format(remaining);

      }


      if(
        $("resumeBtn")
      ){

        $("resumeBtn")
          .disabled=
          remaining>0;

      }


    },1000);

}


/* ============================================================
   PAUSE BEENDEN
   ============================================================ */

function finishPause(){

  const s=
    load();


  if(
    !s?.pause?.active
  ){

    return;

  }


  const duration=
    Date.now() -
    s.pause.startedAt;


  /*
    Unter fünf Minuten darf die Pause
    nicht beendet werden.
  */

  if(
    duration<MIN_PAUSE
  ){

    return;

  }


  s.pausedMs=
    (s.pausedMs||0) +
    duration;


  s.pause=null;


  save(s);


  mission(s);

}

let scanner=null;

let scannerBusy=false;


/* ============================================================
   SCANNER ÖFFNEN
   ============================================================ */

async function openScanner(){

  app.innerHTML=`

    <section class="card">


      <div class="eyebrow">

        QR-Scanner

      </div>


      <h2>

        Stationscode scannen

      </h2>


      <div class="scanner">

        <div id="reader"></div>


        <p class="muted small">

          Erlaubt Safari den Zugriff
          auf die Kamera, falls danach
          gefragt wird.

        </p>

      </div>


      <button
        class="secondary"
        onclick="closeScanner()">

        Scanner schließen

      </button>


    </section>

  `;


  /*
    Falls die QR-Bibliothek nicht geladen
    werden konnte, bekommt ihr eine
    verständliche Fehlermeldung.
  */

  if(
    typeof Html5Qrcode==="undefined"
  ){

    alert(
      "Der QR-Scanner konnte nicht geladen werden."
    );


    mission(
      load()
    );


    return;

  }


  scannerBusy=false;


  scanner=
    new Html5Qrcode(
      "reader"
    );


  scanner.start(

    {
      facingMode:"environment"
    },


    {
      fps:10,

      qrbox:{
        width:240,
        height:240
      }

    },


    text=>{

      /*
        Verhindert, dass derselbe
        QR-Code mehrfach verarbeitet wird.
      */

      if(
        scannerBusy
      ){

        return;

      }


      scannerBusy=true;


      let n=null;


      try{

        const url=
          new URL(
            text,
            location.href
          );


        n=
          Number(
            url.searchParams
              .get("station")
          );


      }catch(e){

        n=null;

      }


      stopScanner()
        .then(()=>{

          if(n){

            checkStation(
              load(),
              n
            );

          }else{

            flash(

              "bad",

              "UNGÜLTIGER QR-CODE",

              ()=>{
                mission(
                  load()
                );
              }

            );

          }

        });

    },


    ()=>{
      /*
        Leere Scanfehler werden absichtlich
        nicht angezeigt, damit beim Scannen
        nicht ständig Meldungen erscheinen.
      */
    }

  )
  .catch(()=>{

    alert(
      "Die Kamera konnte nicht geöffnet werden."
    );


    mission(
      load()
    );

  });

}


/* ============================================================
   SCANNER STOPPEN
   ============================================================ */

async function stopScanner(){

  if(!scanner){

    return;

  }


  try{

    if(
      scanner.isScanning
    ){

      await scanner.stop();

    }


    await scanner.clear();


  }catch(e){

    /*
      Falls die Kamera bereits geschlossen
      wurde, muss kein Fehler angezeigt werden.
    */

  }


  scanner=null;

}


/* ============================================================
   SCANNER SCHLIESSEN
   ============================================================ */

async function closeScanner(){

  await stopScanner();

  mission(
    load()
  );

}

/* ============================================================

   ============================================================ */

function drawPuzzle(){

  const p=
    $("puzzle");


  if(!p){

    return;

  }


  p.innerHTML=

    puzzleOrder
      .map(

        (piece,pos)=>{

          const row=
            Math.floor(
              piece/4
            );


          const col=
            piece%4;


          return `

            <button

              class="
                tile
                ${
                  puzzleSelected===pos
                    ?"selected"
                    :""
                }
              "

              style="
                background-image:
                  url('${WAPPEN}');

                background-position:
                  ${col*(100/3)}%
                  ${row*50}%;

              "

              onclick="
                pickTile(${pos})
              ">

            </button>

          `;

        }

      )
      .join("");

}


/* ============================================================
   PUZZLE-TEILE TAUSCHEN
   ============================================================ */

function pickTile(pos){

  /*
    Erster Klick:
    Teil auswählen.
  */

  if(
    puzzleSelected===null
  ){

    puzzleSelected=
      pos;


    drawPuzzle();

    return;

  }


  /*
    Zweiter Klick:
    Die beiden Teile tauschen.
  */

  [

    puzzleOrder[puzzleSelected],

    puzzleOrder[pos]

  ]=[

    puzzleOrder[pos],

    puzzleOrder[puzzleSelected]

  ];


  puzzleSelected=null;


  drawPuzzle();

}

/* ============================================================

   ============================================================ */

function checkTower(n){

  const s=
    load();


  s.tries[n]=
    (s.tries[n]||0)+1;


  const a=
    norm(
      $("t1").value
    );


  const b=
    norm(
      $("t2").value
    );


  const c=
    norm(
      $("t3").value
    );


  const tools=

    a.includes("hammer")

    &&

    (

      a.includes("schlag")

      ||

      a.includes("schlaegel")

      ||

      a.includes("meissel")

      ||

      a.includes("meißel")

    );


  const greeting=

    b.includes("gluckauf")

    ||

    b.includes("glueckauf");


  const ok=

    tools

    &&

/* ============================================================
   RICHTIGE LÖSUNG
   ============================================================ */

function success(s,n){

  const st=
    STATIONS[n];


  const tries=
    s.tries[n]||1;


  /*
    Die erste richtige Lösung bringt
    die volle Punktzahl.

    Jeder weitere Versuch reduziert
    die Punkte um 20.

    Mindestpunktzahl:
    50 Punkte.
  */

  const earned=
    Math.max(

      50,

      st.points -
      (tries-1)*20

    );


  s.score+=earned;


  if(
    !s.solved.includes(n)
  ){

    s.solved.push(n);

  }


  save(s);


  flash(

    "good",

    `RICHTIG<br>

      <span
        style="font-size:.35em">

        +${earned} Punkte

      </span>`,

    ()=>{

      showNextClue(
        s,
        n
      );

    }

  );

}

/*

   in unterschiedlichen Reihenfolgen

   Deshalb wird die Überleitung immer

/* ============================================================
   NÄCHSTE STATION
   ============================================================ */

function nextStation(){

  const s=
    load();


  s.pos++;


  /*
    Alle zehn Stationen wurden
    abgeschlossen.
  */

  if(
    s.pos>=s.route.length
  ){

    finish(s);

    return;

  }


  save(s);


  mission(s);

}


/* ============================================================
   ERGEBNIS SPEICHERN
   ============================================================ */

function storeResult(s){

  const results=
    loadResults();


  const entry={

    ...s,

    duration:
      elapsed(s)

  };


  const index=
    results.findIndex(

      x=>
        x.id===s.id

    );


  if(
    index>=0
  ){

    results[index]=
      entry;

  }else{

    results.push(
      entry
    );

  }


  saveResults(
    results
  );

}

/* ============================================================
   QR-CODES FÜR DEN VERANSTALTER
   ============================================================ */

function createQRs(){

  const box=
    $("qrList");


  if(
    !box ||
    typeof QRCode==="undefined"
  ){

    return;

  }


  box.innerHTML=

    Object.entries(
      STATIONS
    )

    .map(

      ([n,st])=>`

        <div class="qrcard">


          <div class="eyebrow">

            Station ${n}

          </div>


          <h3>

            ${st.title}

          </h3>


          <div
            id="qr-${n}"
            class="qr">

          </div>


          <p class="small">

            ${st.admin}

          </p>


        </div>

      `

    )

    .join("");


  Object.keys(
    STATIONS
  )

  .forEach(n=>{


    new QRCode(

      $("qr-"+n),

      {

        text:

          location.origin+

          location.pathname+

          "?station="+n,


        width:170,

        height:170,


        correctLevel:
          QRCode.CorrectLevel.H

      }

    );


  });

}

   ERGEBNISSE LÖSCHEN
   ============================================================ */

  if(
    !confirm(

    )
  ){

  }


  localStorage.removeItem(
    RESULTS
  );


  admin();

}


/* ============================================================
   START DER WEBSITE
   ============================================================ */

function start(){

  const params=
    new URLSearchParams(
      location.search
    );


  /*
    ?neu=1
    setzt das aktuelle Testspiel zurück.
  */

  if(
    params.get("neu")==="1"
  ){

    localStorage.removeItem(
      STATE
    );


    location.href=
      location.pathname;


    return;

  }


  /*
    ?admin=1
    öffnet den Veranstalterbereich.
  */

  if(
    params.get("admin")==="1"
  ){

    if(
      sessionStorage.getItem(
        ADMIN_SESSION
      )==="yes"
    ){

      admin();

    }else{

      adminLogin();

    }


    return;

  }


  const s=
    load();


  /*
    Noch kein Spiel vorhanden:
    Startseite zeigen.
  */

  if(!s){

    landing();

    return;

  }


  /*
    Bereits beendet:
    Ergebnis anzeigen.
  */

  if(
    s.finished
  ){

    finish(s);

    return;

  }


  /*
    Wurde ein QR-Code gescannt,
    wird ?station=X ausgewertet.
  */

  const station=
    stationParam();


  if(station){

    cleanUrl();


    checkStation(
      s,
      station
    );


    return;

  }


  /*
    Normales laufendes Spiel.
  */

  mission(s);

}


/* ============================================================
   WEBSITE STARTEN
   ============================================================ */

start();
