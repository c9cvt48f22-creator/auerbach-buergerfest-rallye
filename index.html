<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Die Nachricht aus der Vergangenheit</title>
<style>
:root{--bg:#f3eee4;--card:#fffaf1;--ink:#2e2a25;--accent:#b27a35;--soft:#eadfcf;--ok:#dcebd9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
#app{max-width:760px;margin:auto;padding:14px 14px 92px}
.card{background:var(--card);border-radius:22px;padding:22px;box-shadow:0 4px 20px #00000012}
h1{font-size:clamp(30px,8vw,52px);line-height:1.05;margin:0 0 18px}
h2{font-size:clamp(23px,6vw,32px);margin:22px 0 12px}
h3{margin:14px 0 8px}
p{font-size:18px;line-height:1.5}
button,input,select,textarea{font:inherit}
button{border:0;border-radius:13px;background:var(--soft);color:var(--ink);padding:12px 15px;margin:5px;cursor:pointer}
button.primary{background:var(--accent);color:white}
button:disabled{opacity:.45}
input,select,textarea{width:100%;padding:12px;border:1px solid #cdbfa9;border-radius:11px;background:white;margin:5px 0 10px}
.info,.clue,.warning,.success{padding:14px 16px;border-radius:14px;background:#eee4d4;margin:12px 0}
.warning{background:#f4dfb5}.success{background:var(--ok)}
.big{font-size:21px;font-weight:700}.center{text-align:center}
.small{font-size:14px}.muted{opacity:.7}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.score{font-weight:700}
.tasktitle{font-size:14px;text-transform:uppercase;letter-spacing:.08em;opacity:.65}
.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;width:min(740px,calc(100% - 20px));display:flex;justify-content:flex-end;gap:5px;pointer-events:none}
.bottom button{pointer-events:auto;font-size:13px;padding:9px 11px;box-shadow:0 2px 10px #0002;margin:0}
.bottom .danger{background:#ded4c4}
.overlay{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.overlay .card{max-width:500px;width:100%}
.hidden{display:none!important}

/* Wappen-Puzzle */
.puzzle{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;max-width:520px;margin:16px auto}
.piece{padding:0;margin:0;aspect-ratio:1;border-radius:2px;background-repeat:no-repeat;background-color:#ddd}
.piece.selected{outline:4px solid var(--accent);z-index:2}

/* Logic */
.logic{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;align-items:center}
.logic>div{font-size:14px}
@media(max-width:620px){.logic{grid-template-columns:1fr}.logic .head{display:none}}
.row{padding:10px;background:#f0e7d9;border-radius:12px;margin:7px 0}
.statement{display:block;width:100%;text-align:left}
.statement.selected{outline:3px solid var(--accent)}

/* Word grid */
.wordgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;max-width:600px}
.letter{padding:0;margin:0;border-radius:4px;aspect-ratio:1;font-weight:700;background:#e8dece}

/* Memory */
.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.memorycard{aspect-ratio:1;padding:3px;margin:0;font-size:14px;font-weight:700}
.memorycard.open,.memorycard.matched{background:#e2c78f}
.memorycard.matched{outline:3px solid #78906e}

/* Image choices */
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{margin:0;padding:7px}
.choice img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px}
@media(max-width:450px){.choices{grid-template-columns:1fr 1fr}}

/* Intro / station navigation */
.stationlist{display:grid;gap:8px}
.stationlist button{text-align:left}
</style>
</head>
