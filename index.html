<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stadtrallye Auerbach</title>

<style>
  * {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #f4efe6;
  color: #29251f;
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 13px 18px;
  margin: 5px;
  cursor: pointer;
  background: #29251f;
  color: white;
}

button.secondary {
  background: #d8d0c3;
  color: #29251f;
}

button.hint {
  background: transparent;
  color: #29251f;
  border: 1px solid #aaa;
}

#app {
  min-height: 100vh;
}

.page {
  max-width: 760px;
  margin: auto;
  padding: 24px 18px 100px;
}

.hero {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.eyebrow {
  font-size: 12px;
  letter-spacing: 2px;
  text-transform: uppercase;
  opacity: .6;
}

h1 {
  font-size: clamp(32px, 9vw, 58px);
  line-height: 1.05;
  margin: 12px 0 20px;
}

h2 {
  margin-top: 28px;
}

p {
  line-height: 1.6;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 22px;
  margin-top: 20px;
  box-shadow: 0 5px 25px rgba(0,0,0,.08);
}

input,
textarea,
select {
  width: 100%;
  padding: 13px;
  margin: 7px 0 16px;
  border: 1px solid #ccc;
  border-radius: 10px;
  background: white;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 15px;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  padding: 12px 18px;
  background: rgba(244,239,230,.95);
  backdrop-filter: blur(8px);
}

.bottom-tools {
  position: fixed;
  right: 12px;
  bottom: 12px;
  display: flex;
  gap: 6px;
  z-index: 20;
}

.tool {
  width: 46px;
  height: 46px;
  padding: 0;
  border-radius: 50%;
}

.info {
  padding: 15px;
  background: #eee8dc;
  border-radius: 12px;
  margin: 18px 0;
}

.warning {
  padding: 15px;
  background: #f3dfbd;
  border-radius: 12px;
}

.grid {
  display: grid;
  gap: 10px;
}

.grid.two {
  grid-template-columns: repeat(2, 1fr);
}

.station-button {
  min-height: 100px;
  background: white;
  color: #29251f;
  border: 1px solid #ddd;
  text-align: left;
}

.choice.selected {
  outline: 3px solid #29251f;
}

.story-card {
  padding: 16px;
  margin: 8px 0;
  background: #f4efe6;
  border-radius: 12px;
}

.memory {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.memory-card {
  min-height: 90px;
  padding: 8px;
  font-size: 13px;
}

.memory-card.open,
.memory-card.matched {
  background: white;
  color: #29251f;
  outline: 3px solid #29251f;
}

.puzzle {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}

.puzzle-piece {
  aspect-ratio: 1;
}

.hidden {
  display: none !important;
}

.big {
  font-size: 22px;
  font-weight: bold;
}

.center {
  text-align: center;
}

.muted {
  opacity: .65;
}

@media (max-width: 600px) {

  .page {
    padding: 18px 14px 100px;
  }

  .memory {
    grid-template-columns: repeat(3, 1fr);
  }

  .grid.two {
    grid-template-columns: 1fr;
  }

}
 </style>
</head>

<body>

<div id="app"></div>

<script>

const app = document.getElementById("app");

const stations = [
  {
    id: "wappen",
    title: "Das zerbrochene Stadtwappen"
  },
  {
    id: "bergleute",
    title: "Das Geheimnis der Bergleute"
  },
  {
    id: "jahreszahlen",
    title: "Die Zeitsprünge Auerbachs"
  },
  {
    id: "loewe",
    title: "Die Bestellung im Goldenen Löwen"
  },
  {
    id: "stromer",
    title: "Das Geheimnis des Doktor Stromer"
  },
  {
    id: "auerochse",
    title: "Das Gedächtnis des Goldenen Urs"
  },
  {
    id: "buecherei",
    title: "Der versteckte Buchstabensalat"
  },
  {
    id: "kirche",
    title: "Das Geheimnis im Erz"
  },
  {
    id: "brunnen",
    title: "Der geheime Markttag"
  }
];

let game = {
  team: "",
  players: "",
  score: 0,
  route: [],
  current: 0,
  solved: [],
  skipped: [],
  hints: {},
  locationHints: {},
  notes: ""
};


function save() {
  localStorage.setItem(
    "auerbachRallye",
    JSON.stringify(game)
  );
}


function load() {

  const saved =
    localStorage.getItem("auerbachRallye");

  if (saved) {
    game = JSON.parse(saved);
  }

}


function shuffle(array) {

  return [...array].sort(
    () => Math.random() - 0.5
  );

}


function startPage() {

  app.innerHTML = `

    <main class="page hero">

      <div class="eyebrow">
        Stadtrallye Bürgerfest
      </div>

      <h1>
        Die Nachricht aus der Vergangenheit
      </h1>

      <p>
        Vor langer Zeit wurde eine geheimnisvolle
        Nachricht in zwölf Teile zerlegt.
        Ihre Spuren führen mitten durch Auerbach.
      </p>

      <div class="card">

        <label>
          Teamname
          <input
            id="team"
            placeholder="Euer Teamname">
        </label>

        <label>
          Teammitglieder
          <textarea
            id="players"
            rows="3"
            placeholder="Namen der Teammitglieder"></textarea>
        </label>

        <button onclick="startGame()">
          Rallye starten
        </button>

      </div>

    </main>
  `;
}


function startGame() {

  const team =
    document.getElementById("team")
      .value.trim();

  const players =
    document.getElementById("players")
      .value.trim();

  if (!team || !players) {

    alert(
      "Bitte Teamname und Teammitglieder eingeben."
    );

    return;
  }

  game = {
    team,
    players,
    score: 0,
    route: shuffle(
      stations.map(s => s.id)
    ),
    current: 0,
    solved: [],
    skipped: [],
    hints: {},
    locationHints: {},
    notes: ""
  };

  save();

  showStation();

}


function currentStation() {

  return stations.find(
    s => s.id === game.route[game.current]
  );

}


function showStation() {

  const station =
    currentStation();

  if (!station) {

    showFinale();

    return;
  }

  app.innerHTML = `

    <div class="topbar">

      <span>
        ${game.team}
      </span>

      <strong>
        ${game.score} Punkte
      </strong>

    </div>

    <main class="page">

      <div class="card">

        <div class="eyebrow">
          Euer Abenteuer
        </div>

        <h1>
          ${station.title}
        </h1>

        <div id="task"></div>

      </div>

    </main>

    <div class="bottom-tools">

      <button
        class="tool"
        onclick="showNotes()">
        📝
      </button>

      <button
        class="tool"
        onclick="pauseGame()">
        ⏸
      </button>

    </div>
  `;

  renderTask(station.id);

}


function renderTask(id) {

  const task =
    document.getElementById("task");

  task.innerHTML = `

    <p>
      Dieses Rätsel wird jetzt mit seiner
      endgültigen Aufgabe gefüllt.
    </p>

    <div class="info">
      <strong>
        Testversion
      </strong>

      <p>
        Das technische Grundgerüst funktioniert.
        Die echten Rätsel bauen wir jetzt einzeln ein.
      </p>
    </div>

    <button onclick="solveStation()">
      Testaufgabe lösen
    </button>

    <br>

    <button
      class="hint"
      onclick="useHint('${id}')">
      💡 Hinweis (−20 Punkte)
    </button>

    <button
      class="hint"
      onclick="showLocationHint()">
      📍 Ort anzeigen (−10 Punkte)
    </button>

    <br>

    <button
      class="secondary"
      onclick="skipStation()">
      Aufgabe überspringen
    </button>

  `;

}


function solveStation() {

  const id =
    game.route[game.current];

  if (!game.solved.includes(id)) {

    game.solved.push(id);
    game.score += 100;

  }

  game.current++;

  save();

  showTransition();

}


function skipStation() {

  if (
    !confirm(
      "Möchtet ihr diese Aufgabe wirklich überspringen?"
    )
  ) {
    return;
  }

  const id =
    game.route[game.current];

  if (!game.skipped.includes(id)) {
    game.skipped.push(id);
  }

  game.current++;

  save();

  showTransition(true);

}


function showTransition(skipped = false) {

  const next =
    currentStation();

  app.innerHTML = `

    <main class="page">

      <div class="card center">

        <div class="eyebrow">
          ${skipped
            ? "Aufgabe übersprungen"
            : "Spur gefunden"}
        </div>

        <h1>
          Eure nächste Spur wartet.
        </h1>

        <p>
          Folgt der geheimnisvollen Spur
          zum nächsten Ort.
        </p>

        <button
          onclick="showLocationHint()">
          📍 Ort anzeigen (−10 Punkte)
        </button>

        <br>

        <button onclick="showStation()">
          Weiter
        </button>

      </div>

    </main>
  `;

}


function useHint(id) {

  game.hints[id] =
    (game.hints[id] || 0) + 1;

  game.score =
    Math.max(0, game.score - 20);

  save();

  alert(
    "💡 Hinweis:\n\n" +
    "Schaut euch die Aufgabe noch einmal ganz genau an."
  );

}


function showLocationHint() {

  game.score =
    Math.max(0, game.score - 10);

  save();

  const next =
    currentStation();

  alert(
    "📍 Eure nächste Spur:\n\n" +
    (next
      ? next.title
      : "Das große Finale")
  );

}


function showNotes() {

  app.innerHTML = `

    <main class="page">

      <div class="card">

        <h1>📝 Notizen</h1>

        <textarea
          id="notes"
          rows="12"
          placeholder="Eure Notizen...">${game.notes}</textarea>

        <button onclick="saveNotes()">
          Speichern
        </button>

        <button
          class="secondary"
          onclick="showStation()">
          Zurück
        </button>

      </div>

    </main>
  `;

}


function saveNotes() {

  game.notes =
    document.getElementById("notes").value;

  save();

  showStation();

}


function pauseGame() {

  app.innerHTML = `

    <main class="page">

      <div class="card center">

        <h1>⏸ Pause</h1>

        <p>
          Eure Punkte und der bisherige Fortschritt
          bleiben gespeichert.
        </p>

        <p class="big">
          ${game.score} Punkte
        </p>

        <button onclick="showStation()">
          Rallye fortsetzen
        </button>

      </div>

    </main>
  `;

}


function showFinale() {

  app.innerHTML = `

    <main class="page">

      <div class="card center">

        <div class="eyebrow">
          Das große Finale
        </div>

        <h1>
          Die Nachricht aus der Vergangenheit
        </h1>

        <p>
          Hier kommt später das echte
          24-Karten-Memory mit den zwölf
          Teilen der geheimen Nachricht.
        </p>

        <button onclick="finalMessage()">
          Finale öffnen
        </button>

      </div>

    </main>
  `;

}


function finalMessage() {

  app.innerHTML = `

    <main class="page">

      <div class="card center">

        <div class="eyebrow">
          Die Nachricht ist vollständig
        </div>

        <h1>
          Was einer beginnt,
          können viele vollenden.
        </h1>

        <p>
          Was viele gemeinsam tragen,
          bleibt bestehen.
        </p>

        <p>
          Denn eine Stadt ist nicht nur ein Ort.
          Sie lebt durch die Menschen,
          die sie gemeinsam gestalten.
        </p>

        <hr>

        <h2>
          Und genau das passiert hier.
        </h2>

        <p>
          Unser Bürgerfest entsteht nicht von allein.
          Es braucht Vereine, Gewerbetreibende,
          Ehrenamtliche, Organisatoren und Besucher.
        </p>

        <p>
          Vielleicht seid ihr die Nächsten.
        </p>

        <p>
          Vielleicht findet ihr einen Verein,
          der zu euch passt.
          Vielleicht entdeckt ihr ein Hobby,
          bei dem ihr mitmachen möchtet.
          Vielleicht habt ihr irgendwann selbst
          eine Idee, die ihr mit anderen umsetzt.
        </p>

        <h2>
          Denn ihr habt heute selbst erlebt:
        </h2>

        <p class="big">
          Alleine kann man etwas beginnen.<br>
          Gemeinsam kann man etwas bewegen.
        </p>

        <h1>
          AUERBACH LEBT DURCH EUCH. ❤️
        </h1>

        <p class="big">
          ${game.score} Punkte
        </p>

      </div>

    </main>
  `;

}


load();

if (game.team) {
  showStation();
} else {
  startPage();
}

</script>
  </body>
</html>
