  const APP = document.getElementById("app");

const STATE_KEY = "auerbach_rallye_state";
const RESULTS_KEY = "auerbach_rallye_results";

const HINT_COST = 20;
const LOCATION_COST = 10;

const STATIONS = {

  wappen: {
    title: "Das zerbrochene Stadtwappen",
    points: 100
  },

  bergleute: {
    title: "Das Geheimnis der Bergleute",
    points: 120
  },

  jahreszahlen: {
    title: "Die Zeitsprünge Auerbachs",
    points: 120
  },

  loewe: {
    title: "Die Bestellung im Goldenen Löwen",
    points: 150
  },

  stromer: {
    title: "Das Geheimnis des Doktor Stromer",
    points: 120
  },

  auerochse: {
    title: "Das Gedächtnis des Goldenen Urs",
    points: 130
  },

  buecherei: {
    title: "Der versteckte Buchstabensalat",
    points: 100
  },

  kirche: {
    title: "Das Geheimnis im Erz",
    points: 130
  },

  brunnen: {
    title: "Der geheime Markttag",
    points: 140
  },

  finale: {
    title: "Die Nachricht aus der Vergangenheit",
    points: 250
  }

};


/* ---------- Speicher ---------- */

function loadState() {

  const data =
    localStorage.getItem(STATE_KEY);

  return data
    ? JSON.parse(data)
    : null;
}


function saveState(state) {

  localStorage.setItem(
    STATE_KEY,
    JSON.stringify(state)
  );

}


function loadResults() {

  const data =
    localStorage.getItem(RESULTS_KEY);

  return data
    ? JSON.parse(data)
    : [];

}


function saveResults(results) {

  localStorage.setItem(
    RESULTS_KEY,
    JSON.stringify(results)
  );

}


/* ---------- Hilfsfunktionen ---------- */

function $(id) {
  return document.getElementById(id);
}


function esc(text) {

  return String(text || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");

}


function shuffle(array) {

  return [...array]
    .sort(() => Math.random() - 0.5);

}


function show(text) {

  APP.innerHTML = text;

}


/* ---------- Spiel erstellen ---------- */

function createGame(team, players) {

  const ids =
    Object.keys(STATIONS)
      .filter(id => id !== "finale");

  const route =
    shuffle(ids);

  route.push("finale");

  const state = {

    team,
    players,

    route,

    position: 0,

    score: 0,

    solved: [],

    skipped: [],

    hints: {},

    locationHints: {},

    notes: "",

    startTime: Date.now(),

    finished: false

  };

  saveState(state);

  return state;

}


/* ---------- aktuelles Rätsel ---------- */

function currentStation(state) {

  return state.route[
    state.position
  ];

}


/* ---------- Punktabzug ---------- */

function useHint(state, station) {

  if (!state.hints[station]) {

    state.hints[station] = 0;

  }

  state.hints[station]++;

  state.score =
    Math.max(
      0,
      state.score - HINT_COST
    );

  saveState(state);

}


function useLocationHint(state, station) {

  if (state.locationHints[station]) {
    return;
  }

  state.locationHints[station] = true;

  state.score =
    Math.max(
      0,
      state.score - LOCATION_COST
    );

  saveState(state);

}


/* ---------- Zeit ---------- */

function elapsed(state) {

  return Date.now()
    - state.startTime;

}


function formatTime(ms) {

  const total =
    Math.floor(ms / 1000);

  const min =
    Math.floor(total / 60);

  const sec =
    total % 60;

  return (

    String(min).padStart(2,"0")
    + ":"
    + String(sec).padStart(2,"0")

  );

}

function startGame() {

  const team =
    $("teamName").value.trim();

  const players =
    $("players").value.trim();

  if (!team) {

    alert("Bitte gebt zuerst einen Teamnamen ein.");

    return;

  }

  if (!players) {

    alert("Bitte gebt die Teammitglieder ein.");

    return;

  }

  const state =
    createGame(
      team,
      players
    );

  mission(state);

}


/* ---------- Spieloberfläche ---------- */

function mission(state) {

  const station =
    currentStation(state);

  if (!station) {

    finish(state);

    return;

  }

  if (station === "finale") {

    finale(state);

    return;

  }

  renderStation(
    state,
    station
  );

}


function renderStation(state, station) {

  const data =
    STATIONS[station];

  show(`

    <div class="topbar">

      <span>
        ${esc(state.team)}
      </span>

      <span>
        ${state.score} Punkte
      </span>

    </div>

    <main class="card">

      <div class="eyebrow">
        Euer nächstes Abenteuer
      </div>

      <h1>
        ${esc(data.title)}
      </h1>

      <div id="stationContent">
      </div>

    </main>

    <div class="bottom-tools">

      <button
        class="tool"
        onclick="openNotes()">
        📝
      </button>

      <button
        class="tool"
        onclick="pauseGame()">
        ⏸
      </button>

    </div>

  `);

  renderTask(
    state,
    station
  );

}


/* ---------- Aufgabe laden ---------- */

function renderTask(state, station) {

  switch (station) {

    case "wappen":
      taskWappen(state);
      break;

    case "bergleute":
      taskBergleute(state);
      break;

    case "jahreszahlen":
      taskJahreszahlen(state);
      break;

    case "loewe":
      taskLoewe(state);
      break;

    case "stromer":
      taskStromer(state);
      break;

    case "auerochse":
      taskAuerochse(state);
      break;

    case "buecherei":
      taskBuecherei(state);
      break;

    case "kirche":
      taskKirche(state);
      break;

    case "brunnen":
      taskBrunnen(state);
      break;

    default:
      alert("Unbekannte Aufgabe: " + station);

  }

}
  function taskWappen(state) {

  const box = $("stationContent");

  box.innerHTML = `

    <p>
      Eine alte Nachricht wurde in zwölf Teile zerlegt.
      Euer erstes Stück wartet dort, wo Auerbach
      seine Geschichte in einem Zeichen trägt.
    </p>

    <h2>Setzt das Wappen zusammen</h2>

    <div id="wappenPuzzle" class="puzzle">
      <p class="muted">
        Hier wird später das Wappenbild in 12 Teile geteilt.
      </p>
    </div>

    <div id="wappenQuestion" hidden>

      <p>
        Wie heißen die drei Berge auf dem Wappen?
      </p>

      <input
        id="berg1"
        placeholder="Berg 1">

      <input
        id="berg2"
        placeholder="Berg 2">

      <input
        id="berg3"
        placeholder="Berg 3">

      <button onclick="checkWappen(state)">
        Antwort prüfen
      </button>

    </div>

    ${hintButtons(state, "wappen")}

    ${skipButton(state)}

  `;

  buildWappenPuzzle();

}


function buildWappenPuzzle() {

  const puzzle =
    $("wappenPuzzle");

  const pieces =
    Array.from(
      {length:12},
      (_,i) => i + 1
    );

  puzzle.innerHTML = pieces
    .map(i => `
      <button
        class="puzzle-piece"
        onclick="selectPuzzlePiece(this)">
        ${i}
      </button>
    `)
    .join("");

}


function selectPuzzlePiece(button) {

  button.classList.add("selected");

  const selected =
    document.querySelectorAll(
      ".puzzle-piece.selected"
    );

  if (selected.length === 12) {

    $("wappenQuestion").hidden = false;

  }

}


function checkWappen(state) {

  const answers = [
    $("berg1").value.trim().toLowerCase(),
    $("berg2").value.trim().toLowerCase(),
    $("berg3").value.trim().toLowerCase()
  ];

  /*
    Die endgültigen drei Bergnamen
    tragen wir nach der letzten Prüfung
    der Auerbacher Wappenquelle ein.
  */

  const correct = [
    "berg1",
    "berg2",
    "berg3"
  ];

  if (
    answers.length === 3 &&
    answers.every(x => x.length > 0)
  ) {

    solveStation(
      state,
      "wappen"
    );

  } else {

    alert(
      "Bitte gebt alle drei Berge ein."
    );

  }

}


/* ---------- Bergleute ---------- */

function taskBergleute(state) {

  $("stationContent").innerHTML = `

    <p>

      die richtigen Empfänger sie lesen konnten.
    </p>

      hinterlassen. Jeder Buchstabe wurde im

    </p>

    <div class="status info">

      <strong>
        Euer Schlüssel
      </strong>

      <p>
        Der Schlüssel steckt im Gruß der Bergleute.
        Findet selbst heraus, welche Zahl ihr braucht.
      </p>

    </div>

    <h2>Geheime Nachricht</h2>

    <div class="cipher">
      <strong>
        GLÜCKAUF-KAMERAD
      </strong>
    </div>

    <label>
      Verschiebung
      <input
        id="caesarShift"
        type="number"
        min="0"
        max="25"
        placeholder="?">
    </label>

    <label>
      Entschlüsselte Nachricht
      <textarea
        id="caesarAnswer"
        rows="3"
        placeholder="Schreibt hier eure Lösung hinein"></textarea>
    </label>

    <button
      onclick="checkBergleute(state)">
      Nachricht prüfen
    </button>

    ${hintButtons(state, "bergleute")}

    ${skipButton(state)}

  `;

}


function checkBergleute(state) {

  const shift =
    Number(
      $("caesarShift").value
    );

  const answer =
    $("caesarAnswer")
      .value
      .trim()
      .toLowerCase();

  /*
    Vorläufige technische Prüfung.
    Die endgültige verschlüsselte Nachricht
    kommt in den finalen Rätselblock.
  */

  if (
    shift >= 1 &&
    shift <= 25 &&
    answer.length > 0
  ) {

    solveStation(
      state,
      "bergleute"
    );

  } else {

    alert(
      "Entschlüsselt die Nachricht zuerst."
    );

  }

}

function checkYears(state) {

  const correct = [
    "1314","1373","1390","1418",
    "1430","1434","1441","1476"
  ];

  const answers =
    correct.map(
      (_,i) =>
        $(`year_${i}`).value
    );

  if (
    answers.every(
      (value,i) =>
        value === correct[i]
    )

    solveStation(
      state,
      "jahreszahlen"

  } else {

      "Noch stimmt nicht alles. Prüft die Ereignisse noch einmal genau."
    );

}

function createChoiceButtons(id, values) {

  $(id).innerHTML =
    values.map(value => `
      <button
        class="choice"
        data-value="${value}"
        onclick="selectChoice(this)">
        ${value}
      </button>
    `).join("");

}


function selectChoice(button) {

  button.classList.toggle("selected");

}

/* ---------- Station lösen ---------- */

function solveStation(state, station) {

  if (
    !state.solved.includes(station)
  ) {

    state.solved.push(station);

  }

  state.score +=
    STATIONS[station].points;

  saveState(state);

  showTransition(
    state,
    station
  );

}


/* ---------- Überspringen ---------- */

function skipStation() {

  const state =
    loadState();

  if (!state) return;

  const station =
    currentStation(state);

  if (
    !confirm(
      "Aufgabe wirklich überspringen?"
    )
  ) {

    return;

  }

  if (
    !state.skipped.includes(station)
  ) {

    state.skipped.push(station);

  }

  saveState(state);

  showTransition(
    state,
    station,
    true
  );

}

/* ---------- Memory ---------- */

function buildMemory() {

  const pairs = [

    ["WAPPEN","Eine Stadt trägt ihre Geschichte in ihren Zeichen."],
    ["BERGBAU","Auf andere zählen zu können, macht stark."],
    ["MARKT","Wo Menschen zusammenkommen, entstehen Geschichten."],
    ["STROMER","Eine Idee wird groß, wenn andere sie weitertragen."],
    ["AUEROCHSE","Wer genau hinsieht, entdeckt mehr."],
    ["BÜCHER","Manche Antworten warten darauf, gefunden zu werden."],
    ["KIRCHE","Was bewahrt wird, kann weiter erzählen."],
    ["GEMEINSCHAFT","Gemeinsam entsteht etwas Größeres."],
    ["VEREIN","Jeder kann etwas beitragen."],
    ["BÜRGERFEST","Viele Menschen machen ein Fest lebendig."],
    ["GESCHICHTE","Was gestern geschah, kann morgen noch wichtig sein."],
    ["ZUSAMMEN","Aus vielen Teilen wird ein Ganzes."]
  ];

  let cards = [];

  pairs.forEach((pair,i) => {

    cards.push({
      id:i,
      value:pair[0],
      pair:i
    });

    cards.push({
      id:i + 100,
      value:pair[1],
      pair:i
    });

  });

  cards =
    shuffle(cards);

  window.memoryCards = cards;
  window.memoryOpen = [];
  window.memorySolved = [];

  const game =
    $("memoryGame");

  game.innerHTML =
    cards.map((card,i) => `
      <button
        class="memory-card"
        data-index="${i}"
        onclick="flipMemory(${i})">
        ?
      </button>
    `).join("");

}


/* ---------- Memory drehen ---------- */

function flipMemory(index) {

  if (
    window.memorySolved.includes(index)
    ||
    window.memoryOpen.includes(index)
  ) {

    return;

  }

  if (
    window.memoryOpen.length >= 2
  ) {

    return;

  }

  const card =
    window.memoryCards[index];

  const button =
    document.querySelector(
      `.memory-card[data-index="${index}"]`
    );

  button.textContent =
    card.value;

  button.classList.add("open");

  window.memoryOpen.push(index);

  if (
    window.memoryOpen.length === 2
  ) {

    setTimeout(
      checkMemoryPair,
      900
    );

  }

}


/* ---------- Memory Paar prüfen ---------- */

function checkMemoryPair() {

  const [a,b] =
    window.memoryOpen;

  const cardA =
    window.memoryCards[a];

  const cardB =
    window.memoryCards[b];

  const buttons =
    [
      document.querySelector(
        `.memory-card[data-index="${a}"]`
      ),
      document.querySelector(
        `.memory-card[data-index="${b}"]`
      )
    ];

  if (
    cardA.pair === cardB.pair
  ) {

    window.memorySolved.push(a);
    window.memorySolved.push(b);

    buttons.forEach(
      button =>
        button.classList.add("matched")
    );

  } else {

    buttons.forEach(
      (button,index) => {

        setTimeout(() => {

          button.textContent = "?";
          button.classList.remove("open");

        }, index * 100);

      }
    );

  }

  window.memoryOpen = [];

  if (
    window.memorySolved.length ===
    window.memoryCards.length
  ) {

    setTimeout(
      finalMessage,
      500
    );

  }

}
