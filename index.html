      --weiss: #ffffff;
      --text: #273240;
      --grau: #697586;

      }
    }

</head>

    function htmlSicher(text) {
      return String(text || "").replace(
        /[&<>"']/g,
        zeichen => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        })[zeichen]
      );
    }

    function normalisieren(text) {
      return String(text || "")
        .toLowerCase()
        .trim()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/ß/g, "ss")
        .replace(/\s+/g, " ");
    }

    function spielLaden() {
      try {
        return JSON.parse(
          localStorage.getItem(SPEICHER_SPIEL)
        );
      } catch (fehler) {
        return null;
      }
    }

    function spielSpeichern(spiel) {
      localStorage.setItem(
        SPEICHER_SPIEL,
        JSON.stringify(spiel)
      );
    }

    function ergebnisseLaden() {
      try {
        return JSON.parse(
          localStorage.getItem(SPEICHER_ERGEBNISSE)
        ) || [];
      } catch (fehler) {

      }

    function ergebnisseSpeichern(ergebnisse) {
      localStorage.setItem(
        SPEICHER_ERGEBNISSE,
        JSON.stringify(ergebnisse)

    function zeitFormatieren(millisekunden) {
      const sekunden = Math.max(
        0,
        Math.floor(millisekunden / 1000)
      );

      const stunden = String(
        Math.floor(sekunden / 3600)
      ).padStart(2, "0");

      const minuten = String(
        Math.floor((sekunden % 3600) / 60)
      ).padStart(2, "0");

      const rest = String(
        sekunden % 60
      ).padStart(2, "0");

      return `${stunden}:${minuten}:${rest}`;
    }

    function aktuelleStation(spiel) {
      return spiel.route[spiel.routenPosition];
    }

    function stationAusAdresse() {
      const parameter =
        new URLSearchParams(location.search);

      const nummer =
        Number(parameter.get("station"));

      return Number.isInteger(nummer) && nummer > 0
        ? nummer
        : null;
    }

    function adressParameterEntfernen() {
      history.replaceState(
        {},
        "",
        location.pathname
      );
    }

    function bildschirmBlitz(
      typ,
      text,
      danach
    ) {
      const element =
        document.createElement("div");

      element.className =
        typ === "gut"
          ? "blitz blitz-gut"
          : "blitz blitz-schlecht";

      element.innerHTML = text;

      document.body.appendChild(element);

      if (navigator.vibrate) {
        navigator.vibrate(
          typ === "gut"
            ? 130
            : [180, 80, 180]
        );
      }

      setTimeout(() => {
        element.remove();

        if (danach) {
          danach();
        }
      }, 1500);
    }

    /*
    ============================================================
    QR-SCANNER
    ============================================================
    */

    let qrScanner = null;
    let scannerBeschaeftigt = false;

    function scannerOeffnen() {
      const spiel = spielLaden();

      document.getElementById("app").innerHTML = `
        <section class="karte">
          <div class="oben-klein">
            QR-Scanner
          </div>

          <h2>
            Stationscode scannen
          </h2>

          <div class="scanner-rahmen">
            <div id="qr-leser"></div>

            <p class="dezent klein">
              Beim ersten Scan fragt Safari nach
              dem Kamerazugriff. Tippt auf
              „Erlauben“ und haltet den QR-Code
              vollständig in den Rahmen.
            </p>
          </div>

          <button
            class="sekundaer"
            onclick="scannerSchliessen()"
          >
            Scanner schließen
          </button>
        </section>
      `;

      if (
        typeof Html5Qrcode === "undefined"
      ) {
        alert(
          "Der Scanner konnte nicht geladen werden. Bitte prüft die Internetverbindung."
        );

        missionsseiteAnzeigen(spiel);
        return;
      }

      qrScanner =
        new Html5Qrcode("qr-leser");

      scannerBeschaeftigt = false;

      qrScanner
        .start(
          {
            facingMode: "environment"
          },

          {
            fps: 10,

            qrbox: {
              width: 240,
              height: 240
            },

            aspectRatio: 1
          },

          gelesenerText => {
            if (scannerBeschaeftigt) {
              return;
            }

            scannerBeschaeftigt = true;

            const nummer =
              stationsNummerAusCode(
                gelesenerText
              );

            scannerStoppen().then(() => {
              if (!nummer) {
                bildschirmBlitz(
                  "schlecht",

                  `
                    UNGÜLTIGER QR-CODE
                    <br>

                    <span style="font-size: 0.34em">
                      Dieser Code gehört nicht
                      zur Rallye.
                    </span>
                  `,

                  () =>
                    missionsseiteAnzeigen(
                      spielLaden()
                    )
                );

                return;
              }

              stationsCodePruefen(
                spielLaden(),
                nummer
              );
            });
          },

          () => {
            /*
            Lesefehler während die Kamera läuft
            werden bewusst nicht angezeigt.
            */
          }
        )
        .catch(fehler => {
          console.error(fehler);

          alert(
            "Die Kamera konnte nicht geöffnet werden. Bitte erlaubt Safari den Kamerazugriff."
          );

          missionsseiteAnzeigen(spiel);
        });
    }

    function stationsNummerAusCode(text) {
      try {
        const adresse =
          new URL(text, location.href);

        const nummer =
          Number(
            adresse.searchParams.get(
              "station"
            )
          );

        return (
          Number.isInteger(nummer) &&
          nummer > 0
        )
          ? nummer
          : null;
      } catch (fehler) {
        const treffer =
          String(text).match(
            /station\s*=\s*(\d+)/i
          );

        return treffer
          ? Number(treffer[1])
          : null;
      }
    }

    async function scannerStoppen() {
      if (!qrScanner) {
        return;
      }

      try {
        if (qrScanner.isScanning) {
          await qrScanner.stop();
        }

        await qrScanner.clear();
      } catch (fehler) {
        console.warn(fehler);
      }

      qrScanner = null;
    }

    async function scannerSchliessen() {
      await scannerStoppen();

      missionsseiteAnzeigen(
        spielLaden()
      );
    }

    }

      const bereich =

                    ausgewaehltesPuzzleTeil ===
                    index
                      ? "ausgewaehlt"

    function puzzleTeilWaehlen(index) {
      if (
        ausgewaehltesPuzzleTeil === null
      ) {
        ausgewaehltesPuzzleTeil =
          index;

        puzzleZeichnen();
        return;
      }

      const alterWert =
        puzzleZustand[
          ausgewaehltesPuzzleTeil
        ];

      puzzleZustand[
        ausgewaehltesPuzzleTeil
      ] =
        puzzleZustand[index];

      puzzleZustand[index] =
        alterWert;

      ausgewaehltesPuzzleTeil =
        null;

      puzzleZeichnen();
    }

            NOCH NICHT RICHTIG
            <br>

            <span style="font-size: 0.34em">
              Mindestens eine Zuordnung
              stimmt noch nicht.
            </span>
          `,

          () =>
            zeitstrahlAufgabeAnzeigen(
              spiel,
              nummer
            )
        );

        return;
      }

      stationErfolgreich(
        spiel,
        nummer
      );
    }

    /*
    ============================================================
    ANTWORTEN UND HINWEISE
    ============================================================
    */

    function textAntwortPruefen(
      nummer,
      feldId
    ) {
      const station =
        STATIONEN[nummer];

      const spiel =
        spielLaden();

      const antwort =
        normalisieren(
          document
            .getElementById(feldId)
            .value
        );

      spiel.versuche[nummer] =
        (
          spiel.versuche[nummer] ||
          0
        ) + 1;

      const korrekt =
        station.antworten.some(
          richtigeAntwort =>
            normalisieren(
              richtigeAntwort
            ) === antwort
        );

      if (!korrekt) {
        spielSpeichern(spiel);

        bildschirmBlitz(
          "schlecht",

          `
            NOCH NICHT RICHTIG
            <br>

            <span style="font-size: 0.34em">
              Überprüft eure Entschlüsselung.
            </span>
          `,

          () =>
            aufgabeAnzeigen(
              spiel,
              nummer
            )
        );

        return;
      }

      stationErfolgreich(
        spiel,
        nummer
      );
    }

    function hinweisNutzen(
      nummer,
      stufe
    ) {
      const station =
        STATIONEN[nummer];

      const spiel =
        spielLaden();

      const schluessel =
        `${nummer}-${stufe}`;

      if (
        !spiel.hinweise[schluessel]
      ) {
        spiel.hinweise[schluessel] =
          true;

        spiel.punkte =
          Math.max(
            0,

            spiel.punkte -
            (
              stufe === 1
                ? 15
                : 25
            )
          );

        spielSpeichern(spiel);
      }

      alert(
        stufe === 1
          ? station.hinweis1
          : station.hinweis2
      );

      aufgabeAnzeigen(
        spiel,
        nummer
      );
    }

    /*
    ============================================================
    STATION ABSCHLIESSEN
    ============================================================
    */

    function stationErfolgreich(
      spiel,
      nummer
    ) {
      const station =
        STATIONEN[nummer];

      const versuche =
        spiel.versuche[nummer] || 1;

      const abzug =
        Math.max(
          0,
          (versuche - 1) * 20
        );

      const erhalten =
        Math.max(
          50,
          station.maximalePunkte -
          abzug
        );

      spiel.punkte += erhalten;

      if (
        !spiel.geloest.includes(
          nummer
        )
      ) {
        spiel.geloest.push(nummer);
      }

      spielSpeichern(spiel);

      bildschirmBlitz(
        "gut",

        `
          RICHTIG
          <br>

          <span style="font-size: 0.36em">
            +${erhalten} Punkte
          </span>
        `,

        () =>
          erkenntnisAnzeigen(
            spiel,
            nummer
          )
      );
    }

    function erkenntnisAnzeigen(
      spiel,
      nummer
    ) {
      const station =
        STATIONEN[nummer];

      document.getElementById("app").innerHTML = `
        <section class="karte">
          <div class="oben-klein">
            Neue Erkenntnis
          </div>

          <h1 style="font-size: 2.7rem">
            Eine weitere Spur
          </h1>

          <p class="einleitung">
            ${station.geschichte}
          </p>

          <div class="status status-info">
            Noch ist nicht klar, wie alle
            Nachrichten miteinander verbunden sind.
          </div>

          <button onclick="naechsteStation()">
            Weiter zur nächsten Spur
          </button>
        </section>
      `;
    }

    function naechsteStation() {
      const spiel =
        spielLaden();

      spiel.routenPosition += 1;

      if (
        spiel.routenPosition >=
        spiel.route.length
      ) {
        spiel.beendet = true;
        spiel.endzeit = Date.now();

        spielSpeichern(spiel);
        ergebnisEintragen(spiel);
        finaleAnzeigen(spiel);

        return;
      }

      spielSpeichern(spiel);
      missionsseiteAnzeigen(spiel);
    }

    /*
    ============================================================
    FINALE UND FEEDBACK
    ============================================================
    */

    function ergebnisEintragen(
      spiel
    ) {
      const alleErgebnisse =
        ergebnisseLaden();

      const position =
        alleErgebnisse.findIndex(
          eintrag =>
            eintrag.id === spiel.id
        );

      const eintrag = {
        ...spiel,

        dauer:
          spiel.endzeit -
          spiel.startzeit
      };

      if (position >= 0) {
        alleErgebnisse[position] =
          eintrag;
      } else {
        alleErgebnisse.push(
          eintrag
        );
      }

      ergebnisseSpeichern(
        alleErgebnisse
      );
    }

    function finaleAnzeigen(
      spiel
    ) {
      document.getElementById("app").innerHTML = `
        <section class="held">
          <div class="oben-klein">
            Mission abgeschlossen
          </div>

          <h1>
            Das Geheimnis<br>
            ist gelüftet
          </h1>

          <p class="einleitung">
            Ein Bürgerfest entsteht nicht durch
            eine einzelne Person.
          </p>

          <p class="einleitung">
            Vereine, Gewerbetreibende,
            Ehrenamtliche, Mitarbeitende der Stadt,
            Organisatoren, Besucher und viele
            weitere Menschen tragen gemeinsam
            dazu bei.
          </p>

          <p class="einleitung">
            <strong>
              Genauso konntet auch ihr diese
              Mission nur gemeinsam als Team lösen.
            </strong>
          </p>

          <div class="raster zwei">
            <div class="status status-gut">
              ${spiel.punkte}
              <br>

              <span class="klein">
                Punkte
              </span>
            </div>

            <div class="status status-info">
              ${
                zeitFormatieren(
                  spiel.endzeit -
                  spiel.startzeit
                )
              }
              <br>

              <span class="klein">
                Spielzeit
              </span>
            </div>
          </div>

          <div class="status status-gut">
            Die Sieger werden am Sonntag
            um 15:00 Uhr bekanntgegeben.
          </div>
        </section>

        <section class="karte">
          <h2>
            Kurzes Feedback
          </h2>

          <label>
            Wie hat euch die Rallye gefallen?

            <select id="bewertung">
              <option value="5">
                😍 Sehr gut
              </option>

              <option value="4">
                🙂 Gut
              </option>

              <option value="3">
                😐 In Ordnung
              </option>

              <option value="2">
                🙁 Eher nicht
              </option>

              <option value="1">
                😞 Gar nicht
              </option>
            </select>
          </label>

          <label>
            Was war besonders gut oder
            was sollen wir verbessern?

            <textarea
              id="feedback"
              placeholder="Ein kurzer Satz reicht."
            ></textarea>
          </label>

          <button onclick="feedbackSpeichern()">
            Feedback speichern
          </button>

          <button
            class="sekundaer"
            onclick="
              location.href =
              '${BASIS_ADRESSE}?admin=1'
            "
          >
            Test-Auswertung öffnen
          </button>
        </section>
      `;
    }

    function feedbackSpeichern() {
      const spiel =
        spielLaden();

      spiel.bewertung =
        document
          .getElementById("bewertung")
          .value;

      spiel.feedback =
        document
          .getElementById("feedback")
          .value
          .trim();

      spielSpeichern(spiel);
      ergebnisEintragen(spiel);

      alert(
        "Vielen Dank für euer Feedback!"
      );
    }

    /*
    ============================================================
    VERANSTALTERBEREICH
    ============================================================
    */

    function veranstalterbereichAnzeigen() {
      const alleErgebnisse =
        ergebnisseLaden()
          .sort(
            (a, b) =>
              (
                b.punkte -
                a.punkte
              )

              ||

              (
                (a.dauer || 0) -
                (b.dauer || 0)
              )
          );

      const tabellenZeilen =
        alleErgebnisse
          .map(
            (eintrag, index) => `
              <tr>
                <td>
                  ${index + 1}
                </td>

                <td>
                  ${htmlSicher(
                    eintrag.teamname
                  )}
                </td>

                <td>
                  ${htmlSicher(
                    eintrag.mitglieder
                  )}
                </td>

                <td>
                  ${eintrag.punkte}
                </td>

                <td>
                  ${
                    zeitFormatieren(
                      eintrag.dauer || 0
                    )
                  }
                </td>

                <td>
                  ${
                    eintrag.bewertung ||
                    "–"
                  }
                </td>

                <td>
                  ${htmlSicher(
                    eintrag.feedback ||
                    ""
                  )}
                </td>

                <td>
                  ${
                    eintrag.fotoErlaubnis ===
                    "ja"
                      ? "Ja"
                      : "Nein"
                  }
                </td>
              </tr>
            `
          )
          .join("");

      const stationsKarten =
        Object.entries(STATIONEN)
          .map(
            ([nummer, station]) => `
              <article class="qr-karte">
                <div class="oben-klein">
                  Station ${nummer}
                </div>

                <h3>
                  ${station.titel}
                </h3>

                <div
                  class="qr-bild"
                  id="qr-${nummer}"
                ></div>

                <p>
                  <strong>
                    QR-Kennung:
                  </strong>

                  ${station.verwaltung.code}
                </p>

                <div class="standort">
                  <strong>
                    Vorgesehener Ort
                  </strong>

                  <br>

                  ${station.verwaltung.ort}
                </div>

                <p>
                  <strong>
                    Befestigung:
                  </strong>

                  <br>

                  ${
                    station
                      .verwaltung
                      .befestigung
                  }
                </p>

                <p>
                  <strong>
                    Falls der Code fehlt:
                  </strong>

                  <br>

                  ${
                    station
                      .verwaltung
                      .ersatz
                  }
                </p>

                <p class="klein dezent">
                  Zieladresse:
                  <br>

                  ${BASIS_ADRESSE}?station=${nummer}
                </p>
              </article>
            `
          )
          .join("");

      document.getElementById("app").innerHTML = `
        <section class="karte">
          <div class="oben-klein">
            Veranstalterbereich
          </div>

          <h1 style="font-size: 2.7rem">
            Übersicht
          </h1>

          <p>
            Diese Testversion zeigt nur Ergebnisse,
            die auf diesem Gerät gespeichert wurden.
            Eine zentrale Speicherung für alle
            Handys folgt später.
          </p>

          <div class="tabelle-scroll">
            <table>
              <thead>
                <tr>
                  <th>Platz</th>
                  <th>Team</th>
                  <th>Namen</th>
                  <th>Punkte</th>
                  <th>Zeit</th>
                  <th>Bewertung</th>
                  <th>Feedback</th>
                  <th>Fotos erlaubt</th>
                </tr>
              </thead>

              <tbody>
                ${
                  tabellenZeilen ||

                  `
                    <tr>
                      <td colspan="8">
                        Noch keine Ergebnisse
                        gespeichert.
                      </td>
                    </tr>
                  `
                }
              </tbody>
            </table>
          </div>

          <button
            class="gefahr nicht-drucken"
            onclick="testergebnisseLoeschen()"
          >
            Testergebnisse löschen
          </button>
        </section>

        <section class="karte">
          <div class="oben-klein">
            QR- und Stationsplan
          </div>

          <h2>
            Codes kontrollieren und nachdrucken
          </h2>

          <p>
            In der endgültigen Version stehen hier
            für jede Station der genaue Standort,
            die Befestigungsstelle, die Höhe und
            ein Ersatzhinweis.
          </p>

          <button
            class="sekundaer nicht-drucken"
            onclick="window.print()"
          >
            Übersicht und QR-Codes drucken
          </button>

          <div class="qr-verwaltung">
            ${stationsKarten}
          </div>
        </section>

        <section class="karte nicht-drucken">
          <button
            class="sekundaer"
            onclick="
              location.href =
              '${BASIS_ADRESSE}'
            "
          >
            Zur Rallye zurückkehren
          </button>
        </section>
      `;

      qrCodesErzeugen();
    }

    function qrCodesErzeugen() {
      if (
        typeof QRCode === "undefined"
      ) {
        return;
      }

      Object.keys(STATIONEN).forEach(
        nummer => {
          const bereich =
            document.getElementById(
              `qr-${nummer}`
            );

          if (!bereich) {
            return;
          }

          new QRCode(
            bereich,

            {
              text:
                `${BASIS_ADRESSE}?station=${nummer}`,

              width: 170,
              height: 170,

              correctLevel:
                QRCode.CorrectLevel.H
            }
          );
        }
      );
    }

    function testergebnisseLoeschen() {
      const bestaetigt =
        confirm(
          "Sollen alle lokal gespeicherten Testergebnisse wirklich gelöscht werden?"
        );

      if (!bestaetigt) {
        return;
      }

      localStorage.removeItem(
        SPEICHER_ERGEBNISSE
      );

      veranstalterbereichAnzeigen();
    }

    /*
    ============================================================
    SEITENSTART
    ============================================================
    */

    function seiteStarten() {
      const parameter =
        new URLSearchParams(
          location.search
        );

      if (
        parameter.get("admin") === "1"
      ) {
        veranstalterbereichAnzeigen();
        return;
      }

      const spiel =
        spielLaden();

      if (!spiel) {
        startseiteAnzeigen();
        return;
      }

      if (spiel.beendet) {
        finaleAnzeigen(spiel);
        return;
      }

      const gescannteStation =
        stationAusAdresse();

      if (gescannteStation) {
        adressParameterEntfernen();

        stationsCodePruefen(
          spiel,
          gescannteStation
        );

        return;
      }

      missionsseiteAnzeigen(spiel);
    }

    seiteStarten();
  </script>
</body>
